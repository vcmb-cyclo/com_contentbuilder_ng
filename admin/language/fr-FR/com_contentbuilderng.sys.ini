COM_CONTENTBUILDERNG_FILTER_HELP="<p>Saisissez une valeur pour chaque champ à filtrer.</p><ul><li>Séparez les valeurs alternatives avec <code>|</code>.</li><li>Utilisez <code>*</code> comme caractère générique représentant une suite quelconque de caractères.</li><li>Pour une sortie groupée, saisissez les valeurs dans leur ordre de stockage, séparées par des virgules.</li><li>L’ordre détermine où chaque élément filtré apparaît dans le titre de la page. Utilisez des nombres.</li></ul><p><strong>Exemples</strong></p><ul><li>Valeur unique&#8239;: <code>peter</code></li><li>Valeurs alternatives&#8239;: <code>peter|paul|mary</code></li><li>Caractère générique pour Xavier&#8239;: <code>*vier</code>, <code>Xav*</code>, <code>X*ier</code>, <code>*ve*</code></li><li>Sortie groupée&#8239;: <code>value1,value2</code></li><li>Ordre&#8239;: <code>1</code>, <code>2</code>, <code>3</code></li></ul>"
