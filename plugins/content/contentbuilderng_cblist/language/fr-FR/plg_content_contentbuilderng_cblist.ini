PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="Intègre une vue liste interactive ContentBuilder NG dans un contenu Joomla avec la balise {CBList}. fields= restreint les colonnes visibles et actions= restreint les actions disponibles, sans jamais élargir ce que les droits ACL autorisent déjà."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList&nbsp;: rôle et syntaxe"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>Insérez <code>{CBList id=15}</code> dans un article Joomla pour intégrer la vue liste ContentBuilder NG portant l’identifiant 25. Selon les droits de l’utilisateur courant, le cadre intégré permet de rechercher, trier, parcourir les enregistrements et d’accéder aux écrans de détail ou d’édition d’un enregistrement, sans quitter la page.</p><p><strong>Paramètres principaux&nbsp;:</strong> <code>layout</code> sélectionne l’une des mises en page définies pour la vue, par exemple <code>cards</code>&nbsp;; <code>height</code> définit la hauteur minimale du cadre en pixels, de 240 à 5&nbsp;000, le cadre s’agrandissant au-delà si le contenu a besoin de plus de place&nbsp;; <code>loading</code> détermine le moment où le navigateur charge le cadre&nbsp;: <code>lazy</code>, la valeur par défaut, retarde le chargement jusqu’à ce que le cadre approche de la zone visible, tandis que <code>eager</code> le charge immédiatement avec le reste de la page&nbsp;; <code>title</code> définit le titre accessible du cadre, lu par les lecteurs d’écran et affiché en infobulle, sans ajouter de titre visible dans la page.</p><p><strong>Exemples simples&nbsp;:</strong><br><code>{CBList id=15}</code><br><code>{CBList id=25 layout=cards height=700}</code><br><code>{CBList id=25 loading=eager title=&quot;Inscriptions&quot;}</code></p><p>L’option <code>pagination=25</code> affiche 25 enregistrements par page. Consultez les encarts <strong>fields=</strong> et <strong>actions=</strong> ci-dessous pour restreindre les colonnes et les actions affichées. Ces deux réglages ne font jamais que restreindre ce que les droits ACL de l’utilisateur courant autorisent déjà pour cette vue&nbsp;; aucun ne peut accorder ce que l’ACL refuse.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — restreindre les colonnes visibles"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> ne conserve que les colonnes indiquées parmi celles déjà visibles et autorisées pour l’utilisateur courant dans cette vue. Ce réglage peut uniquement masquer des colonnes&nbsp;; il ne peut jamais révéler une colonne que la vue elle-même ne montre pas déjà.</p><p>Les sélecteurs sont séparés par <code>|</code>, la même convention que <code>{CBStats hide=...}</code>&nbsp;; les virgules et points-virgules sont refusés plutôt que traités silencieusement comme un autre séparateur, car un libellé de champ peut lui-même contenir une virgule. Chaque sélecteur peut être un nom de champ source, un identifiant de référence ou le libellé exact de la colonne&nbsp;; la comparaison ignore la casse, et l’ordre des sélecteurs détermine l’ordre des colonnes.</p><p><code>{CBList id=25 fields=&quot;Nom|Email|Ville&quot;}</code><br><code>{CBList id=25 fields=&quot;12|Email|Ville&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — restreindre les actions disponibles"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> fonctionne comme une liste blanche&nbsp;: dès qu’il est renseigné, plus aucune action n’est activée, sauf celles explicitement citées, sur les écrans de liste, de détail et d’édition à la fois. En son absence, toutes les actions déjà autorisées par l’ACL restent activées, exactement comme avant l’existence de ce paramètre.</p><p><strong>Liste exhaustive des actions contrôlables&nbsp;:</strong></p><ul><li><code>search</code>&nbsp;: la barre de recherche/filtres.</li><li><code>state</code>&nbsp;: le filtre et le contrôle de statut de workflow.</li><li><code>publish</code>&nbsp;: le filtre et le bouton de publication/dépublication.</li><li><code>language</code>&nbsp;: le filtre de langue.</li><li><code>new</code>&nbsp;: la création d’un nouvel enregistrement.</li><li><code>edit</code>&nbsp;: l’ouverture ou l’accès à l’écran d’édition d’un enregistrement existant.</li><li><code>delete</code>&nbsp;: la suppression.</li><li><code>export</code>&nbsp;: le bouton d’export.</li><li><code>rating</code>&nbsp;: le contrôle et l’affichage de la notation.</li><li><code>detail</code>&nbsp;: l’ouverture de l’écran de détail (vue).</li><li><code>print</code>&nbsp;: le bouton d’impression sur l’écran de détail.</li></ul><p>Ce réglage n’élargit jamais ce que l’ACL autorise&nbsp;: une action absente de <code>actions=</code> reste masquée même si l’ACL l’autoriserait, mais une action présente dans <code>actions=</code> exige toujours le droit ACL correspondant pour apparaître ou être accessible. Une URL saisie à la main vers l’écran d’édition ou de détail est bloquée exactement comme l’aurait été le bouton masqué&nbsp;: masquer un contrôle n’est jamais la seule ligne de défense.</p><p>Les sélecteurs sont séparés par <code>|</code>, comme pour <code>fields=</code>&nbsp;; les virgules et points-virgules sont refusés.</p><p><code>{CBList id=25 actions=&quot;search|detail|export&quot;}</code><br><code>{CBList id=25 actions=&quot;new|edit|delete&quot;}</code></p>"
