PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="CBList affiche une vue liste interactive ContentBuilder NG directement dans un article Joomla, tout en conservant les droits d’accès et la configuration de la vue. Exemple simple : {CBList id=15}. Consultez la description ci-dessous pour découvrir toutes les options de syntaxe."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList : rôle, syntaxe et principales options"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>CBList affiche une vue liste ContentBuilder NG directement dans un article Joomla. La liste conserve les droits d’accès et la configuration de la vue.</p><p><strong>Exemple simple :</strong><br><code>{CBList id=15}</code><br>Cet exemple affiche la vue 15 telle qu’elle est configurée dans ContentBuilder NG, sans filtrer ses colonnes ni remplacer son titre, son tri, sa pagination, ses actions, sa mise en page ou son thème.</p><p><strong>Principales options :</strong></p><ul><li><code>id=15</code> : vue ContentBuilder NG à afficher. Cette option est obligatoire.</li><li><code>fields=&quot;Nom|Prenom|Email&quot;</code> : sélectionne les colonnes affichées et leur ordre.</li><li><code>title=&quot;Liste des inscrits&quot;</code> : remplace le titre visible de la vue. Omettez <code>title</code> pour conserver le titre configuré. Utilisez <code>title=hide</code>, ou son équivalent <code>title=&quot;&quot;</code>, pour masquer le titre CB.</li><li><code>sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot;</code> : trie initialement tous les champs indiqués par ordre croissant. Une direction unique s’applique à tous les champs du tri.</li><li><code>pagination=25</code> : affiche 25 enregistrements par page.</li><li><code>actions=&quot;detail|edit|export&quot;</code> : sélectionne les contrôles proposés à l’utilisateur, dans la limite des droits de la vue.</li><li><code>layout=cards</code> : affiche les enregistrements sous forme de cartes plutôt que dans le tableau standard. C’est l’alias lisible de <code>listcard</code>.</li><li><code>height=700</code> : fixe la hauteur minimale initiale du cadre à 700 pixels. Le cadre peut s’agrandir automatiquement si nécessaire.</li><li><code>loading=lazy</code> : valeur par défaut ; charge la liste lorsqu’elle approche de la zone visible. Utilisez <code>loading=eager</code> pour la charger immédiatement.</li></ul><p><strong>Exemple réaliste :</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; title=&quot;Liste des inscrits&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot; pagination=25 actions=&quot;detail|edit|export&quot; layout=cards height=700 loading=lazy}</code></p><p><strong>Thème :</strong> CBList utilise le thème configuré dans la vue ContentBuilder NG. <strong>Thoth</strong> est le thème par défaut et de secours. La balise CBList ne possède pas d’option <code>theme=</code>.</p><p>CBList et CBStats peuvent être associés dans le même article, par exemple un graphique de synthèse suivi de la liste détaillée des enregistrements.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — filtrer et ordonner les colonnes affichées"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> sélectionne les colonnes à afficher et leur ordre parmi les champs disponibles dans la vue ContentBuilder NG. Utilisez uniquement les noms source exacts des éléments, en respectant la casse, ou leurs identifiants de référence exacts. Les libellés affichés et les variantes d’accent ou de casse sont refusés. Séparez les valeurs avec <code>|</code>.</p><p><strong>Trois colonnes affichées :</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot;}</code></p><p><strong>Colonnes affichées avec tri et pagination :</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot; pagination=25}</code></p><p>Une seule valeur <code>dir=&quot;asc&quot;</code> ou <code>dir=&quot;desc&quot;</code> s’applique à tous les champs de <code>sort</code>. Pour mélanger les directions, indiquez-en une par champ, par exemple <code>dir=&quot;asc|desc&quot;</code>. Ajoutez <code>title=&quot;Liste des inscrits&quot;</code> pour remplacer le titre visible ou <code>title=hide</code> pour le masquer complètement. <code>title=&quot;&quot;</code> est équivalent. <code>layout</code>, <code>height</code> et <code>loading</code> règlent la présentation comme expliqué ci-dessus.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — choisir les actions disponibles"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> sélectionne les contrôles disponibles dans les écrans intégrés de liste, de détail et d’édition. Sans cette option, tous les contrôles déjà autorisés par les droits de la vue restent disponibles. Cette option n’accorde jamais un droit refusé par la vue.</p><p><strong>Actions disponibles :</strong></p><ul><li><code>search</code> : affiche la barre de recherche et les filtres.</li><li><code>state</code> : affiche le filtre et le contrôle du statut de workflow.</li><li><code>publish</code> : affiche le filtre et le contrôle de publication ou dépublication.</li><li><code>language</code> : affiche le filtre de langue.</li><li><code>new</code> : permet de créer un nouvel enregistrement.</li><li><code>edit</code> : permet d’ouvrir l’écran d’édition d’un enregistrement existant.</li><li><code>delete</code> : permet de supprimer des enregistrements.</li><li><code>export</code> : affiche le bouton d’export.</li><li><code>rating</code> : affiche et permet d’utiliser la notation.</li><li><code>detail</code> : permet d’ouvrir l’écran de détail d’un enregistrement.</li><li><code>print</code> : affiche le bouton d’impression sur l’écran de détail.</li></ul><p>Séparez les actions avec <code>|</code>.</p><p><code>{CBList id=15 actions=&quot;detail|edit|export&quot;}</code><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; actions=&quot;search|detail|edit|export&quot;}</code></p>"
