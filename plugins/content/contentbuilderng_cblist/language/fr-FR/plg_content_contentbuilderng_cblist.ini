PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="CBList affiche une vue liste interactive ContentBuilder NG directement dans un article Joomla, tout en conservant les droits d’accès et la configuration de la vue. Exemple simple : {CBList id=15}. Consultez la description ci-dessous pour découvrir toutes les options de syntaxe."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList : rôle, syntaxe et principales options"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_PAGINATION_LABEL="Pagination et limitation des résultats"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_PAGINATION_TEXT="<p><code>pagination=20</code> découpe la liste en pages de 20 lignes. <code>pagination=0</code> conserve le nombre de lignes prévu par la vue, mais masque le sélecteur et les liens de pagination.</p><p><code>limit=100</code> plafonne le résultat à 100 lignes après ACL, recherche, filtres et tri. Avec <code>pagination=20</code>, cela donne au maximum 5 pages. L’export utilise le même résultat plafonné. Les nombres s’écrivent sans guillemets.</p><p><strong>Exemples :</strong><br><code>{CBList id=15 pagination=20 limit=100}</code><br><code>{CBList id=15 actions=none pagination=0 limit=10}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LAYOUT_LABEL="Présentation, hauteur et chargement"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LAYOUT_TEXT="<p><code>layout=</code> accepte <code>default</code>, <code>cards</code>, <code>listone</code>, <code>listtwo</code>, <code>listthree</code>, <code>listcard</code>, <code>listcompact</code> ou <code>listtiles</code>. <code>cards</code> est un alias de <code>listcard</code>. Cette option contrôle les lignes internes ; <code>card=h1…v5</code> enveloppe toute la balise.</p><p><code>height=700</code> fixe la hauteur initiale minimale de l’iframe, entre 240 et 5 000 pixels. <code>loading=lazy</code> charge à l’approche de l’écran ; <code>loading=eager</code> charge immédiatement.</p><p><strong>Exemples :</strong><br><code>{CBList id=15 layout=cards height=700 loading=lazy}</code><br><code>{CBList id=15 layout=listcompact loading=eager}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_REFERENCE_LABEL="Référence complète des options"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_REFERENCE_TEXT="<p><strong>Source :</strong> <code>id</code>. <strong>Colonnes et tri :</strong> <code>fields</code>, <code>sort</code>, <code>dir</code>. <strong>Volume :</strong> <code>pagination</code>, <code>limit</code>. <strong>Commandes :</strong> <code>actions</code>. <strong>Présentation :</strong> <code>title</code>, <code>layout</code>, <code>height</code>, <code>loading</code>, <code>card</code>. <strong>Valeur unique :</strong> <code>output</code>, <code>offset</code>.</p><p>Une erreur indique l’option, sa valeur et la règle attendue. Les ACL restent toujours prioritaires.</p><p><strong>Exemple complet :</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc|desc&quot; pagination=20 limit=100 actions=&quot;search|detail|export&quot; title=&quot;Inscriptions&quot; layout=cards height=700 loading=lazy card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>CBList affiche une vue liste ContentBuilder NG directement dans un article Joomla. La liste conserve les droits d’accès et la configuration de la vue.</p><p><strong>Exemple simple :</strong><br><code>{CBList id=15}</code><br>Cet exemple affiche la vue 15 telle qu’elle est configurée dans ContentBuilder NG, sans filtrer ses colonnes ni remplacer son titre, son tri, sa pagination, ses actions, sa mise en page ou son thème.</p><p>Les options numériques <code>id</code>, <code>height</code>, <code>pagination</code> et <code>limit</code> doivent être écrites sans guillemets.</p><p><strong>Principales options :</strong></p><ul><li><code>id=15</code> : vue ContentBuilder NG à afficher. Cette option est obligatoire.</li><li><code>fields=&quot;Nom|Prenom|Email&quot;</code> : sélectionne les colonnes affichées et leur ordre.</li><li><code>title=&quot;Liste des inscrits&quot;</code> : remplace le titre visible de la vue. Omettez <code>title</code> pour conserver le titre configuré. Utilisez <code>title=hide</code>, ou son équivalent <code>title=&quot;&quot;</code>, pour masquer le titre CB.</li><li><code>sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot;</code> : trie initialement tous les champs indiqués par ordre croissant. Une direction unique s’applique à tous les champs du tri.</li><li><code>pagination=25</code> : affiche 25 enregistrements par page.</li><li><code>limit=10</code> : conserve au maximum les 10 premiers enregistrements accessibles après les ACL, la recherche, les filtres et le tri. La pagination et les exports portent sur ce sous-ensemble limité.</li><li><code>actions=&quot;detail|edit|export&quot;</code> : sélectionne les contrôles proposés à l’utilisateur, dans la limite des droits de la vue.</li><li><code>layout=cards</code> : affiche les enregistrements sous forme de cartes plutôt que dans le tableau standard. C’est l’alias lisible de <code>listcard</code>.</li><li><code>height=700</code> : fixe la hauteur minimale initiale du cadre à 700 pixels. Le cadre peut s’agrandir automatiquement si nécessaire.</li><li><code>loading=lazy</code> : valeur par défaut ; charge la liste lorsqu’elle approche de la zone visible. Utilisez <code>loading=eager</code> pour la charger immédiatement.</li></ul><p><strong>Exemple réaliste :</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; title=&quot;Liste des inscrits&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot; pagination=25 limit=10 actions=&quot;detail|edit|export&quot; layout=cards height=700 loading=lazy}</code></p><p><strong>Thème :</strong> CBList utilise le thème configuré dans la vue ContentBuilder NG. <strong>Thoth</strong> est le thème par défaut et de secours. La balise CBList ne possède pas d’option <code>theme=</code>.</p><p>CBList et CBStats peuvent être associés dans le même article, par exemple un graphique de synthèse suivi de la liste détaillée des enregistrements.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — filtrer et ordonner les colonnes affichées"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> sélectionne les colonnes à afficher et leur ordre parmi les champs disponibles dans la vue ContentBuilder NG. Utilisez uniquement les noms source exacts des éléments, en respectant la casse, ou leurs identifiants de référence exacts. Les libellés affichés et les variantes d’accent ou de casse sont refusés. Séparez les valeurs avec <code>|</code>. Un élément existant indiqué dans <code>fields</code> reste valide s’il est dépublié ou désactivé pour la liste ; ContentBuilder omet simplement cette colonne sans signaler d’erreur de syntaxe.</p><p><strong>Trois colonnes affichées :</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot;}</code></p><p><strong>Colonnes affichées avec tri et pagination :</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot; pagination=25}</code></p><p>Une seule valeur <code>dir=&quot;asc&quot;</code> ou <code>dir=&quot;desc&quot;</code> s’applique à tous les champs de <code>sort</code>. Pour mélanger les directions, indiquez-en une par champ, par exemple <code>dir=&quot;asc|desc&quot;</code>. Ajoutez <code>title=&quot;Liste des inscrits&quot;</code> pour remplacer le titre visible ou <code>title=hide</code> pour le masquer complètement. <code>title=&quot;&quot;</code> est équivalent. <code>layout</code>, <code>height</code> et <code>loading</code> règlent la présentation comme expliqué ci-dessus.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_VALUE_LABEL="output=value — renvoyer une valeur texte unique"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_VALUE_TEXT="<p><code>{CBList id=15 fields=&quot;Nom&quot; output=value}</code> renvoie uniquement la dernière valeur du champ <code>Nom</code>, au format texte Unicode et sans iframe. Tous les ACL, restrictions, recherches et filtres de CB sont appliqués avant le tri.</p><p>Par défaut, ce mode utilise <code>sort=ID dir=desc offset=0</code>. Utilisez <code>offset=1</code> pour l’avant-dernier résultat, ou choisissez explicitement un autre champ de tri et <code>dir=asc</code> ou <code>dir=desc</code>. <code>fields</code> doit contenir exactement un champ. <code>offset</code> est un entier compris entre 0 et 4 999, sans guillemets.</p><p>Les options <code>pagination</code>, <code>actions</code>, <code>title</code>, <code>layout</code>, <code>height</code> et <code>loading</code> sont refusées avec <code>output=value</code>. En l’absence de résultat, CBList ne renvoie rien. Dans une liste normale, <code>pagination=0</code> masque le sélecteur et les contrôles de pagination sans modifier le nombre de lignes.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — choisir les actions disponibles"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> sélectionne les contrôles disponibles dans les écrans intégrés de liste, de détail et d’édition. Sans cette option, tous les contrôles déjà autorisés par les droits de la vue restent disponibles. Cette option n’accorde jamais un droit refusé par la vue.</p><p><strong>Actions disponibles :</strong></p><ul><li><code>search</code> : affiche la barre de recherche et les filtres.</li><li><code>state</code> : affiche le filtre et le contrôle du statut de workflow.</li><li><code>publish</code> : affiche le filtre et le contrôle de publication ou dépublication.</li><li><code>language</code> : affiche le filtre de langue.</li><li><code>new</code> : permet de créer un nouvel enregistrement.</li><li><code>edit</code> : permet d’ouvrir l’écran d’édition d’un enregistrement existant.</li><li><code>delete</code> : permet de supprimer des enregistrements.</li><li><code>export</code> : affiche le bouton d’export.</li><li><code>rating</code> : affiche et permet d’utiliser la notation.</li><li><code>detail</code> : permet d’ouvrir l’écran de détail d’un enregistrement.</li><li><code>print</code> : affiche le bouton d’impression sur l’écran de détail.</li></ul><p>Séparez les actions avec <code>|</code>.</p><p><code>{CBList id=15 actions=&quot;detail|edit|export&quot;}</code><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; actions=&quot;search|detail|edit|export&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_VALIDATION_INTRO="CBList ne peut pas être affiché. Correction nécessaire :"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_NONE_LABEL="actions=none — masquer toutes les commandes de liste"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_NONE_TEXT="<p><code>actions=none</code> masque et interdit toutes les actions CBList&nbsp;: recherche et filtres, création, détail, édition, suppression, export, notation et impression. L’absence de <code>actions</code> ou <code>actions=&quot;&quot;</code> conserve les réglages de la vue.</p><p>Les contrôles de pagination sont indépendants. Pour afficher les données sans aucune commande en haut ou en bas, utilisez&nbsp;:<br><code>{CBList id=15 actions=none pagination=0}</code></p><p><code>none</code> ne peut pas être associé à une autre action.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_SYNTAX_HELP="Aide sur la syntaxe CBList"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EMPTY_VALUE="valeur vide"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_UNKNOWN_OPTION="Le paramètre CBList « %1$s » est inconnu (valeur reçue : « %2$s »)."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_INVALID_OPTION_VALUE="Le paramètre CBList « %1$s » contient la valeur invalide « %2$s ». %3$s"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_UNKNOWN_ACTION="Le paramètre CBList « actions » contient l’action inconnue « %s »."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_UNKNOWN_VIEW="Le paramètre CBList « id » contient « %s », qui ne correspond à aucune vue ContentBuilder NG."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_ID="Indiquez l’ID entier positif d’une vue ContentBuilder NG existante, par exemple id=15."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_NUMERIC_SYNTAX="Écrivez les options numériques sans guillemets, par exemple id=15, pagination=20, limit=10 ou offset=1."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_HEIGHT="Indiquez un nombre entier compris entre 240 et 5 000 pixels."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_PAGINATION="Indiquez 0 pour masquer les contrôles, ou un entier compris entre 1 et 5 000 enregistrements par page."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LIMIT="Indiquez un nombre entier compris entre 1 et 5 000 enregistrements affichés."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OFFSET="Indiquez un entier compris entre 0 et 4 999, sans guillemets."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OUTPUT="Valeurs autorisées : list ou value."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_SINGLE_FIELD="Avec output=value, fields doit contenir exactement un champ."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OUTPUT_COMPATIBILITY="Cette option de présentation ne peut pas être utilisée avec output=value."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OFFSET_MODE="offset peut uniquement être utilisé avec output=value."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LAYOUT="Valeurs autorisées : default, cards, listone, listtwo, listthree, listcard, listcompact ou listtiles."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LOADING="Valeurs autorisées : lazy ou eager."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_FIELDS="Séparez les noms source exacts des éléments, en respectant la casse, ou leurs identifiants de référence exacts avec |, par exemple fields=\"Nom|Prenom|Email\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_ACTIONS="Utilisez none seul, ou séparez les actions avec |. Actions autorisées : search, state, publish, language, new, edit, delete, export, rating, detail et print."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_SORT="Séparez les noms source exacts des éléments, en respectant la casse, ou leurs identifiants de référence exacts avec |, par exemple sort=\"Nom|Prenom\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_DIR="Utilisez asc ou desc. Une seule valeur s’applique à toutes les colonnes de tri."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_DIR_COUNT="Indiquez soit une direction pour toutes les colonnes de tri, soit une direction par colonne séparée avec |."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_IFRAME_TITLE="Vue liste ContentBuilder NG %d"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_OPEN_LIST="Ouvrir la liste dans une page séparée"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_CARD="Utilisez card=h1 à card=h6 ou card=v1 à card=v6."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_W="Utilisez w=33, w=66 ou w=100 sans guillemets."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_W_CARD="L’option w nécessite une option card valide."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_WIDTH_LABEL="Largeur des Cards"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_WIDTH_TEXT="<p>Dans un conteneur <code>cb-cards</code>, ajoutez <code>w=33</code> pour une colonne, <code>w=66</code> pour deux colonnes ou <code>w=100</code> pour toute la ligne. Écrivez la valeur sans guillemets et uniquement avec <code>card=</code>. Sans <code>w=</code>, une Card V vaut 33 et une Card H vaut 100. Sur petit écran, toutes passent à 100 %.</p><p><strong>Exemple :</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBList id=15 title=&quot;Liste courte&quot; card=v1 w=33}<br>{CBList id=15 title=&quot;Liste large&quot; card=v2 w=66}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_LABEL="Card ContentBuilder NG commune facultative"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_CUSTOMIZE_LABEL="Personnaliser les Cards"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_GRID_LABEL="Juxtaposer les Cards V"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ARTICLE_EXAMPLE_LABEL="Exemple d’article complet sur deux lignes"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ARTICLE_EXAMPLE_TEXT="<p>Un seul conteneur <code>cb-cards</code> peut contenir six Cards V : les trois premières occupent la première ligne et les trois suivantes passent automatiquement sur la deuxième. N’ajoutez ni <code>&lt;br&gt;</code> ni second conteneur entre elles. Une Card H utilisée seule n’a pas besoin de conteneur.</p><p><strong>Exemple à coller en mode HTML de l’éditeur Joomla, sans marqueurs Markdown ``` :</strong></p><p><code>&lt;h2&gt;Tableau de bord&lt;/h2&gt;<br>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Groupe output=pie title=&quot;Groupes&quot; card=v1}<br>{CBStats id=15 field=Prenom output=bar title=&quot;Prénoms&quot; card=v2}<br>{CBStats id=15 field=Groupe output=table title=&quot;Détail&quot; card=v3}<br>{CBStats id=15 field=Ville output=pie title=&quot;Villes&quot; card=v4}<br>{CBStats id=15 field=Age output=histogram ranges=&quot;18-29;30-39;40-49;50+&quot; title=&quot;Âges&quot; card=v5}<br>{CBStats id=15 output=total title=&quot;Total&quot; card=v1}<br>&lt;/div&gt;<br>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; title=&quot;Derniers enregistrements&quot; sort=ID dir=desc limit=10 card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_GRID_TEXT="<p>Placez toutes les Cards V à juxtaposer dans un seul conteneur <code>&lt;div class=&quot;cb-cards&quot;&gt;</code>, sans <code>&lt;br&gt;</code> entre les balises. Sur PC, le conteneur affiche trois colonnes ; sur petit écran, une seule. Une Card H placée dans ce conteneur occupe toute la ligne.</p><p><strong>Exemple :</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBList id=15 title=&quot;Liste 1&quot; card=v1}<br>{CBList id=15 title=&quot;Liste 2&quot; card=v2}<br>{CBList id=15 title=&quot;Liste 3&quot; card=v3}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_CUSTOMIZE_TEXT="<p><strong>Pour tout le site :</strong> ajoutez <code>.cb-card-h1 { --cb-card-accent: #005a9c; --cb-card-header-color: #fff; }</code> dans le fichier <code>user.css</code> du template Joomla. Toutes les Cards H1 sont alors modifiées. Remplacez <code>h1</code> par la variante H/V souhaitée.</p><p><strong>Pour un seul article :</strong> entourez les balises avec <code>&lt;div class=&quot;mes-cards&quot;&gt;…&lt;/div&gt;</code>, puis ajoutez <code>&lt;style&gt;.mes-cards .cb-card-h1 { --cb-card-accent: #005a9c; }&lt;/style&gt;</code> dans l’article si son éditeur et la politique du site autorisent les éléments style. Le conteneur évite de modifier les autres pages.</p><p><code>--cb-card-accent</code> contrôle la couleur du bandeau. Les personnalisations avancées peuvent utiliser <code>--cb-card-header-bg</code>, <code>--cb-card-header-color</code>, <code>--cb-card-bg</code>, <code>--cb-card-color</code> et <code>--cb-card-border-color</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_TEXT="<p><code>card=h1</code> à <code>card=h6</code> ou <code>card=v1</code> à <code>card=v6</code> ajoute une Card colorée. Pour toutes les variantes, le titre reste horizontal et placé au-dessus du contenu. Le bandeau est créé uniquement si <code>title=</code> contient un texte.</p><p><code>{CBList id=15 title=&quot;Inscriptions&quot; card=h1}</code></p><p>Les couleurs peuvent être surchargées dans le fichier <code>user.css</code> de Joomla : <code>.cb-card-h1 { --cb-card-header-bg: #005a9c; --cb-card-header-color: #fff; }</code></p>"
