PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="Intègre une vue liste interactive ContentBuilder NG dans un contenu Joomla avec la balise {CBList}."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="Syntaxe {CBList}"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>Insérez <code>{CBList id=25}</code> dans un article Joomla pour intégrer la vue liste ContentBuilder NG portant l’identifiant 25.</p><p>Paramètres facultatifs&nbsp;: <code>itemid</code> applique les réglages d’un élément de menu ContentBuilder NG&nbsp;; <code>layout</code> sélectionne une mise en page de liste&nbsp;; <code>height</code> définit la hauteur minimale du cadre entre 240 et 5 000 pixels&nbsp;; <code>loading</code> accepte <code>lazy</code> ou <code>eager</code>&nbsp;; <code>title</code> définit le titre accessible du cadre.</p><p>Exemple&nbsp;: <code>{CBList id=25 itemid=142 layout=cards height=700 title=&quot;Inscriptions&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_INVALID_TAG="La balise CBList est invalide. Un identifiant de vue positif est obligatoire."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_IFRAME_TITLE="Vue liste ContentBuilder NG %d"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_OPEN_LIST="Ouvrir la liste dans une page séparée"
