PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="Bindet mit dem Tag {CBList} eine interaktive ContentBuilder-NG-Listenansicht in Joomla-Inhalte ein. fields= schränkt die sichtbaren Spalten ein, actions= schränkt die verfügbaren Aktionen ein — beide erweitern niemals, was die ACL-Rechte bereits erlauben."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList: Zweck und Syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>Fügen Sie <code>{CBList id=25}</code> in einen Joomla-Artikel ein, um die ContentBuilder-NG-Listenansicht mit der Kennung 25 einzubetten. Je nach den Rechten des aktuellen Benutzers kann im eingebetteten Rahmen gesucht, sortiert und geblättert werden, und die Detail- oder Bearbeitungsansicht eines Datensatzes lässt sich öffnen — alles ohne die Seite zu verlassen.</p><p><strong>Grundlegende Parameter:</strong> <code>layout</code> wählt eines der für die Ansicht definierten Listenlayouts, zum Beispiel <code>cards</code>; <code>height</code> legt die minimale Rahmenhöhe in Pixeln fest, zwischen 240 und 5000, wobei der Rahmen darüber hinaus wächst, wenn der Inhalt mehr Platz benötigt; <code>loading</code> bestimmt, wann der Browser den Rahmen lädt: <code>lazy</code>, der Standardwert, verzögert das Laden, bis sich der Rahmen dem sichtbaren Bereich nähert, während <code>eager</code> ihn sofort zusammen mit dem Rest der Seite lädt; <code>title</code> legt den barrierefreien Rahmentitel fest, der von Screenreadern vorgelesen und als Tooltip angezeigt wird, ohne eine sichtbare Überschrift auf der Seite hinzuzufügen.</p><p><strong>Einfache Beispiele:</strong><br><code>{CBList id=25}</code><br><code>{CBList id=25 layout=cards height=700}</code><br><code>{CBList id=25 loading=eager title=&quot;Anmeldungen&quot;}</code></p><p>Die Hinweise zu <strong>fields=</strong> und <strong>actions=</strong> weiter unten erklären, wie sich Spalten und Aktionen einschränken lassen. Beide schränken ausschließlich ein, was die ACL-Rechte des aktuellen Benutzers für diese Ansicht bereits erlauben; keiner der beiden kann etwas gewähren, das die ACL verweigert.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — sichtbare Spalten einschränken"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> behält nur die genannten Spalten unter denen bei, die für den aktuellen Benutzer in dieser Ansicht bereits sichtbar und zulässig sind. Diese Einstellung kann Spalten nur ausblenden; sie kann niemals eine Spalte anzeigen, die die Ansicht selbst nicht bereits zeigt.</p><p>Die Selektoren werden durch <code>|</code> getrennt, dieselbe Konvention wie bei <code>{CBStats hide=...}</code>; Kommas und Semikolons werden abgelehnt, statt sie stillschweigend als alternatives Trennzeichen zu behandeln, da eine Feldbezeichnung selbst ein Komma enthalten kann. Jeder Selektor kann ein Quellfeldname, eine Referenzkennung oder die exakte Spaltenbezeichnung sein; der Vergleich ist nicht case-sensitiv, und die in der Ansicht konfigurierte Spaltenreihenfolge bleibt unabhängig von der Reihenfolge der angegebenen Selektoren erhalten.</p><p><code>{CBList id=25 fields=&quot;Name|E-Mail|Ort&quot;}</code><br><code>{CBList id=25 fields=&quot;12|E-Mail|Ort&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — verfügbare Aktionen einschränken"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> funktioniert als Positivliste: Sobald der Parameter gesetzt ist, ist nichts mehr aktiviert außer den ausdrücklich genannten Aktionen — gleichermaßen auf den Listen-, Detail- und Bearbeitungsbildschirmen. Ohne diesen Parameter bleiben alle durch die ACL bereits erlaubten Aktionen aktiviert, genau wie vor der Einführung dieses Parameters.</p><p><strong>Die vollständige Liste der steuerbaren Aktionen:</strong></p><ul><li><code>search</code>: die Such-/Filterleiste.</li><li><code>state</code>: der Workflow-Statusfilter und das zugehörige Steuerelement.</li><li><code>publish</code>: der Veröffentlichungsfilter und der Umschalter.</li><li><code>language</code>: der Sprachfilter.</li><li><code>new</code>: das Anlegen eines neuen Datensatzes.</li><li><code>edit</code>: das Öffnen oder Erreichen des Bearbeitungsbildschirms für einen bestehenden Datensatz.</li><li><code>delete</code>: das Löschen.</li><li><code>export</code>: die Exportschaltfläche.</li><li><code>rating</code>: das Bewertungssteuerelement und dessen Anzeige.</li><li><code>detail</code>: das Öffnen des Detailbildschirms (Ansicht).</li><li><code>print</code>: die Druckschaltfläche auf dem Detailbildschirm.</li></ul><p>Dies erweitert niemals, was die ACL erlaubt: Eine in <code>actions=</code> nicht genannte Aktion bleibt verborgen, selbst wenn die ACL sie erlauben würde. Eine in <code>actions=</code> genannte Aktion erfordert jedoch weiterhin das entsprechende ACL-Recht, um überhaupt zu erscheinen oder erreichbar zu sein. Eine manuell eingegebene URL zum Bearbeitungs- oder Detailbildschirm wird genauso blockiert, wie es die ausgeblendete Schaltfläche gewesen wäre — das Ausblenden eines Steuerelements ist niemals die einzige Schutzlinie.</p><p>Die Selektoren werden wie bei <code>fields=</code> durch <code>|</code> getrennt; Kommas und Semikolons werden abgelehnt.</p><p><code>{CBList id=25 actions=&quot;search|detail|export&quot;}</code><br><code>{CBList id=25 actions=&quot;new|edit|delete&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_INVALID_TAG="Das CBList-Tag ist ungültig. Eine positive Ansichtskennung ist erforderlich."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_IFRAME_TITLE="ContentBuilder-NG-Listenansicht %d"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_OPEN_LIST="Liste auf einer separaten Seite öffnen"
