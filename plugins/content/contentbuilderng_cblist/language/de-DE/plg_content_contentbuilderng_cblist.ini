PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="CBList zeigt eine interaktive ContentBuilder-NG-Listenansicht direkt in einem Joomla-Artikel an und behält dabei die Zugriffsrechte und die Konfiguration der Ansicht bei. Einfaches Beispiel: {CBList id=15}. Alle Syntaxoptionen finden Sie in der nachfolgenden Beschreibung."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList: Zweck, Syntax und wichtigste Optionen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_PAGINATION_LABEL="Seitennavigation und Ergebnisbegrenzung"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_PAGINATION_TEXT="<p><code>pagination=20</code> teilt die Liste in Seiten mit 20 Zeilen. <code>pagination=0</code> behält die Zeilenzahl der Ansicht bei, blendet aber Auswahl und Seitennavigation aus.</p><p><code>limit=100</code> begrenzt das Ergebnis nach ACLs, Suche, Filtern und Sortierung auf 100 Zeilen. Mit <code>pagination=20</code> entstehen höchstens 5 Seiten. Zahlen stehen ohne Anführungszeichen.</p><p><strong>Beispiele:</strong><br><code>{CBList id=15 pagination=20 limit=100}</code><br><code>{CBList id=15 actions=none pagination=0 limit=10}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LAYOUT_LABEL="Layout, Höhe und Laden"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LAYOUT_TEXT="<p><code>layout=</code> akzeptiert <code>default</code>, <code>cards</code>, <code>listone</code>, <code>listtwo</code>, <code>listthree</code>, <code>listcard</code>, <code>listcompact</code> oder <code>listtiles</code>. <code>cards</code> ist ein Alias für <code>listcard</code>. Dies steuert interne Zeilen; <code>card=h1…v5</code> umschließt das vollständige Tag.</p><p><code>height=700</code> setzt die anfängliche Mindesthöhe des Iframes. <code>loading=lazy</code> lädt nahe am sichtbaren Bereich, <code>loading=eager</code> sofort.</p><p><strong>Beispiele:</strong><br><code>{CBList id=15 layout=cards height=700 loading=lazy}</code><br><code>{CBList id=15 layout=listcompact loading=eager}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_REFERENCE_LABEL="Vollständige Optionsreferenz"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_REFERENCE_TEXT="<p><strong>Quelle:</strong> <code>id</code>. <strong>Spalten und Sortierung:</strong> <code>fields</code>, <code>sort</code>, <code>dir</code>. <strong>Umfang:</strong> <code>pagination</code>, <code>limit</code>. <strong>Bedienung:</strong> <code>actions</code>. <strong>Darstellung:</strong> <code>title</code>, <code>layout</code>, <code>height</code>, <code>loading</code>, <code>card</code>. <strong>Einzelwert:</strong> <code>output</code>, <code>offset</code>.</p><p>Fehler nennen Option, Wert und erwartete Regel. ACLs bleiben maßgeblich.</p><p><strong>Vollständiges Beispiel:</strong><br><code>{CBList id=15 fields=&quot;Name|Vorname|Email&quot; sort=&quot;Name|Vorname&quot; dir=&quot;asc|desc&quot; pagination=20 limit=100 actions=&quot;search|detail|export&quot; title=&quot;Anmeldungen&quot; layout=cards height=700 loading=lazy card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>CBList zeigt eine ContentBuilder-NG-Listenansicht direkt in einem Joomla-Artikel an. Die Liste behält die Zugriffsrechte und die Konfiguration der Ansicht.</p><p><strong>Einfaches Beispiel:</strong><br><code>{CBList id=15}</code><br>Dieses Beispiel zeigt Ansicht 15 mit den in ContentBuilder NG konfigurierten Spalten, Titel-, Sortier-, Seiten-, Aktions-, Layout- und Themeneinstellungen, ohne CBList-Anpassung.</p><p>Die numerischen Optionen <code>id</code>, <code>height</code>, <code>pagination</code> und <code>limit</code> müssen ohne Anführungszeichen geschrieben werden.</p><p><strong>Wichtigste Optionen:</strong></p><ul><li><code>id=15</code>: anzuzeigende ContentBuilder-NG-Ansicht. Diese Option ist erforderlich.</li><li><code>fields=&quot;Name|Vorname|E-Mail&quot;</code>: wählt die angezeigten Spalten und ihre Reihenfolge.</li><li><code>title=&quot;Teilnehmerliste&quot;</code>: ersetzt den sichtbaren Ansichtstitel. Ohne <code>title</code> bleibt der konfigurierte Titel erhalten. Verwenden Sie <code>title=hide</code> oder das gleichwertige <code>title=&quot;&quot;</code>, um den CB-Titel auszublenden.</li><li><code>sort=&quot;Name|Vorname&quot; dir=&quot;asc&quot;</code>: sortiert alle genannten Felder zunächst aufsteigend. Eine einzelne Richtung gilt für alle Sortierfelder.</li><li><code>pagination=25</code>: zeigt 25 Datensätze pro Seite.</li><li><code>limit=10</code>: behält nach ACLs, Suche, Filtern und Sortierung höchstens die ersten 10 zugänglichen Datensätze. Seitennavigation und Export gelten für diese begrenzte Teilmenge.</li><li><code>actions=&quot;detail|edit|export&quot;</code>: wählt die für den Benutzer verfügbaren Steuerelemente im Rahmen der Ansichtsrechte.</li><li><code>layout=cards</code>: zeigt Datensätze als Karten statt in der Standardtabelle. Dies ist der lesbare Alias von <code>listcard</code>.</li><li><code>height=700</code>: legt eine anfängliche Mindesthöhe von 700 Pixeln fest. Der Rahmen kann bei Bedarf automatisch wachsen.</li><li><code>loading=lazy</code>: Standardwert; lädt die Liste, wenn sie sich dem sichtbaren Bereich nähert. <code>loading=eager</code> lädt sie sofort.</li></ul><p><strong>Realistisches Beispiel:</strong><br><code>{CBList id=15 fields=&quot;Name|Vorname|E-Mail&quot; title=&quot;Teilnehmerliste&quot; sort=&quot;Name|Vorname&quot; dir=&quot;asc&quot; pagination=25 limit=10 actions=&quot;detail|edit|export&quot; layout=cards height=700 loading=lazy}</code></p><p><strong>Theme:</strong> CBList verwendet das in der ContentBuilder-NG-Ansicht konfigurierte Theme. <strong>Thoth</strong> ist das Standard- und Fallback-Theme. Das CBList-Tag besitzt keine Option <code>theme=</code>.</p><p>CBList und CBStats können im selben Artikel kombiniert werden, beispielsweise ein Übersichtsdiagramm mit der zugehörigen Detailliste.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — angezeigte Spalten filtern und ordnen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_VALUE_LABEL="output=value — einen einzelnen Textwert zurückgeben"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_VALUE_TEXT="<p><code>{CBList id=15 fields=&quot;Nom&quot; output=value}</code> gibt nur den neuesten Wert des Feldes <code>Nom</code> als Unicode-Text und ohne Iframe zurück. Alle CB-Zugriffsrechte, Einschränkungen, Suchen und Filter werden vor der Sortierung angewendet.</p><p>Dieser Modus verwendet standardmäßig <code>sort=ID dir=desc offset=0</code>. Mit <code>offset=1</code> wird das vorherige Ergebnis gewählt; alternativ können ein anderes Sortierfeld sowie <code>dir=asc</code> oder <code>dir=desc</code> angegeben werden. <code>fields</code> muss genau ein Feld enthalten. <code>offset</code> ist eine ganze Zahl von 0 bis 4.999 ohne Anführungszeichen.</p><p><code>pagination</code>, <code>actions</code>, <code>title</code>, <code>layout</code>, <code>height</code> und <code>loading</code> sind mit <code>output=value</code> nicht zulässig. Ohne Ergebnis gibt CBList nichts zurück. Bei normaler Listenausgabe blendet <code>pagination=0</code> den Auswahlknopf und die Seitennavigation aus, ohne die Zeilenzahl zu ändern.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> wählt die anzuzeigenden Spalten und ihre Reihenfolge aus den in der ContentBuilder-NG-Ansicht verfügbaren Feldern. Verwenden Sie ausschließlich exakte, groß-/kleinschreibungssensitive Quellelementnamen oder exakte Referenz-IDs. Anzeigebezeichnungen sowie Akzent- oder Schreibweisenvarianten werden abgelehnt. Trennen Sie Werte mit <code>|</code>. Ein in <code>fields</code> genanntes vorhandenes Element bleibt gültig, wenn es unveröffentlicht oder für die Listenanzeige deaktiviert ist; ContentBuilder lässt die Spalte dann ohne Syntaxfehlermeldung weg.</p><p><strong>Drei angezeigte Spalten:</strong><br><code>{CBList id=15 fields=&quot;Name|Vorname|Email&quot;}</code></p><p><strong>Spalten mit Sortierung und Seitengröße:</strong><br><code>{CBList id=15 fields=&quot;Name|Vorname|Email&quot; sort=&quot;Name|Vorname&quot; dir=&quot;asc&quot; pagination=25}</code></p><p>Ein einzelnes <code>dir=&quot;asc&quot;</code> oder <code>dir=&quot;desc&quot;</code> gilt für alle Felder in <code>sort</code>. Für gemischte Richtungen wird pro Feld ein Wert angegeben, zum Beispiel <code>dir=&quot;asc|desc&quot;</code>. <code>title=&quot;Teilnehmerliste&quot;</code> ersetzt den sichtbaren Titel; <code>title=hide</code> blendet ihn vollständig aus. <code>title=&quot;&quot;</code> ist gleichwertig. <code>layout</code>, <code>height</code> und <code>loading</code> steuern die Darstellung wie oben beschrieben.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — verfügbare Aktionen auswählen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> wählt die in den eingebetteten Listen-, Detail- und Bearbeitungsansichten verfügbaren Steuerelemente. Ohne diese Option bleiben alle durch die Ansichtsrechte bereits erlaubten Steuerelemente verfügbar. Die Option gewährt niemals ein von der Ansicht verweigertes Recht.</p><p><strong>Verfügbare Aktionen:</strong></p><ul><li><code>search</code>: zeigt die Such- und Filterleiste an.</li><li><code>state</code>: zeigt den Workflow-Statusfilter und das Steuerelement an.</li><li><code>publish</code>: zeigt Filter und Steuerung für Veröffentlichen oder Zurückziehen an.</li><li><code>language</code>: zeigt den Sprachfilter an.</li><li><code>new</code>: erlaubt das Erstellen eines neuen Datensatzes.</li><li><code>edit</code>: erlaubt das Öffnen der Bearbeitungsansicht eines Datensatzes.</li><li><code>delete</code>: erlaubt das Löschen von Datensätzen.</li><li><code>export</code>: zeigt die Exportschaltfläche an.</li><li><code>rating</code>: zeigt und erlaubt die Bewertungssteuerung.</li><li><code>detail</code>: erlaubt das Öffnen der Detailansicht eines Datensatzes.</li><li><code>print</code>: zeigt die Druckschaltfläche in der Detailansicht an.</li></ul><p>Trennen Sie Aktionen mit <code>|</code>.</p><p><code>{CBList id=15 actions=&quot;detail|edit|export&quot;}</code><br><code>{CBList id=15 fields=&quot;Name|Vorname|E-Mail&quot; actions=&quot;search|detail|edit|export&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_VALIDATION_INTRO="CBList kann nicht angezeigt werden. Korrektur erforderlich:"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_NONE_LABEL="actions=none — alle Listensteuerelemente ausblenden"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_NONE_TEXT="<p><code>actions=none</code> blendet alle CBList-Aktionen aus und sperrt sie: Suche und Filter, Neu, Detail, Bearbeiten, Löschen, Export, Bewertung und Drucken. Ohne <code>actions</code> oder mit <code>actions=&quot;&quot;</code> bleiben die Ansichtseinstellungen erhalten.</p><p>Die Seitennavigation ist davon unabhängig. Verwenden Sie für Daten ohne Steuerelemente oben oder unten:<br><code>{CBList id=15 actions=none pagination=0}</code></p><p><code>none</code> kann nicht mit einer anderen Aktion kombiniert werden.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_SYNTAX_HELP="Hilfe zur CBList-Syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EMPTY_VALUE="leerer Wert"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_UNKNOWN_OPTION="Der CBList-Parameter \"%1$s\" ist unbekannt (empfangener Wert: \"%2$s\")."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_INVALID_OPTION_VALUE="Der CBList-Parameter \"%1$s\" enthält den ungültigen Wert \"%2$s\". %3$s"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_UNKNOWN_ACTION="Der CBList-Parameter \"actions\" enthält die unbekannte Aktion \"%s\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_UNKNOWN_VIEW="Der CBList-Parameter \"id\" enthält \"%s\"; dieser Wert entspricht keiner ContentBuilder-NG-Ansicht."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_ID="Geben Sie die positive ganzzahlige ID einer vorhandenen ContentBuilder-NG-Ansicht ein, zum Beispiel id=15."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_NUMERIC_SYNTAX="Schreiben Sie numerische Optionen ohne Anführungszeichen, zum Beispiel id=15, pagination=20, limit=10 oder offset=1."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_HEIGHT="Geben Sie eine ganze Zahl zwischen 240 und 5000 Pixeln ein."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_PAGINATION="Geben Sie 0 zum Ausblenden der Steuerelemente oder eine ganze Zahl zwischen 1 und 5000 Datensätzen pro Seite ein."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LIMIT="Geben Sie eine ganze Zahl zwischen 1 und 5000 angezeigten Datensätzen ein."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OFFSET="Geben Sie eine ganze Zahl von 0 bis 4999 ohne Anführungszeichen ein."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OUTPUT="Zulässige Werte: list oder value."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_SINGLE_FIELD="Mit output=value muss fields genau ein Feld enthalten."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OUTPUT_COMPATIBILITY="Diese Darstellungsoption kann nicht mit output=value verwendet werden."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OFFSET_MODE="offset kann nur mit output=value verwendet werden."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LAYOUT="Zulässige Werte: default, cards, listone, listtwo, listthree, listcard, listcompact oder listtiles."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LOADING="Zulässige Werte: lazy oder eager."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_FIELDS="Trennen Sie exakte, groß-/kleinschreibungssensitive Quellelementnamen oder exakte Referenz-IDs mit |, zum Beispiel fields=\"Name|Vorname|Email\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_ACTIONS="Verwenden Sie none allein oder trennen Sie Aktionen mit |. Zulässige Aktionen: search, state, publish, language, new, edit, delete, export, rating, detail und print."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_SORT="Trennen Sie exakte, groß-/kleinschreibungssensitive Quellelementnamen oder exakte Referenz-IDs mit |, zum Beispiel sort=\"Name|Vorname\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_DIR="Verwenden Sie asc oder desc. Ein einzelner Wert gilt für alle Sortierspalten."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_DIR_COUNT="Geben Sie entweder eine Richtung für alle Sortierspalten oder je Spalte eine mit | getrennte Richtung an."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_IFRAME_TITLE="ContentBuilder-NG-Listenansicht %d"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_OPEN_LIST="Liste auf einer separaten Seite öffnen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_CARD="Verwenden Sie card=h1 bis card=h6 oder card=v1 bis card=v6."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_W="Verwenden Sie w=33, w=66 oder w=100 ohne Anführungszeichen."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_W_CARD="Die Option w erfordert eine gültige card-Option."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_WIDTH_LABEL="Card-Breiten"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_WIDTH_TEXT="<p>Fügen Sie in einem <code>cb-cards</code>-Container <code>w=33</code> für eine Spalte, <code>w=66</code> für zwei Spalten oder <code>w=100</code> für die gesamte Zeile hinzu. Schreiben Sie den Wert ohne Anführungszeichen und nur zusammen mit <code>card=</code>. Ohne <code>w=</code> verwendet eine V-Card 33 und eine H-Card 100. Auf kleinen Bildschirmen verwenden alle Cards 100 %.</p><p><strong>Beispiel:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBList id=15 title=&quot;Kurze Liste&quot; card=v1 w=33}<br>{CBList id=15 title=&quot;Breite Liste&quot; card=v2 w=66}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_LABEL="Optionale gemeinsame ContentBuilder-NG-Card"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_CUSTOMIZE_LABEL="Cards anpassen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_GRID_LABEL="V-Cards nebeneinander anordnen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ARTICLE_EXAMPLE_LABEL="Vollständiges Artikelbeispiel mit zwei Zeilen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ARTICLE_EXAMPLE_TEXT="<p>Ein gemeinsamer <code>cb-cards</code>-Container kann sechs V-Cards enthalten: Die ersten drei stehen in der ersten Zeile, die nächsten drei automatisch in der zweiten. Fügen Sie weder <code>&lt;br&gt;</code> noch einen weiteren Container dazwischen ein. Eine einzelne H-Card benötigt keinen Container.</p><p><strong>Im HTML-Modus des Joomla-Editors ohne Markdown-```-Markierungen einfügen:</strong></p><p><code>&lt;h2&gt;Dashboard&lt;/h2&gt;<br>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Gruppe output=pie title=&quot;Gruppen&quot; card=v1}<br>{CBStats id=15 field=Vorname output=bar title=&quot;Vornamen&quot; card=v2}<br>{CBStats id=15 field=Gruppe output=table title=&quot;Details&quot; card=v3}<br>{CBStats id=15 field=Ort output=pie title=&quot;Orte&quot; card=v4}<br>{CBStats id=15 field=Alter output=histogram ranges=&quot;18-29;30-39;40-49;50+&quot; title=&quot;Alter&quot; card=v5}<br>{CBStats id=15 output=total title=&quot;Summe&quot; card=v1}<br>&lt;/div&gt;<br>{CBList id=15 fields=&quot;Name|Vorname|Email&quot; title=&quot;Neueste Datensätze&quot; sort=ID dir=desc limit=10 card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_GRID_TEXT="<p>Setzen Sie alle auszurichtenden V-Cards in einen gemeinsamen Container <code>&lt;div class=&quot;cb-cards&quot;&gt;</code>, ohne <code>&lt;br&gt;</code> zwischen den Tags. Auf dem Desktop entstehen drei Spalten, auf kleinen Bildschirmen eine. Eine H-Card im Container belegt die vollständige Zeile.</p><p><strong>Beispiel:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBList id=15 title=&quot;Liste 1&quot; card=v1}<br>{CBList id=15 title=&quot;Liste 2&quot; card=v2}<br>{CBList id=15 title=&quot;Liste 3&quot; card=v3}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_CUSTOMIZE_TEXT="<p><strong>Für die gesamte Website:</strong> Fügen Sie <code>.cb-card-h1 { --cb-card-accent: #005a9c; --cb-card-header-color: #fff; }</code> zur Datei <code>user.css</code> des Joomla-Templates hinzu. Dadurch werden alle H1-Cards geändert. Ersetzen Sie <code>h1</code> durch die gewünschte H/V-Variante.</p><p><strong>Nur für einen Artikel:</strong> Umschließen Sie die Tags mit <code>&lt;div class=&quot;meine-cards&quot;&gt;…&lt;/div&gt;</code> und fügen Sie <code>&lt;style&gt;.meine-cards .cb-card-h1 { --cb-card-accent: #005a9c; }&lt;/style&gt;</code> in den Artikel ein, wenn Editor und Website-Richtlinie Style-Elemente erlauben. Der Container verhindert Auswirkungen auf andere Seiten.</p><p><code>--cb-card-accent</code> steuert die Kopffarbe. Erweiterte Anpassungen können <code>--cb-card-header-bg</code>, <code>--cb-card-header-color</code>, <code>--cb-card-bg</code>, <code>--cb-card-color</code> und <code>--cb-card-border-color</code> verwenden.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_TEXT="<p><code>card=h1</code> bis <code>card=h6</code> oder <code>card=v1</code> bis <code>card=v6</code> fügt eine farbige Card hinzu. Bei allen Varianten steht der Titel horizontal über dem Inhalt. Ein Kopf wird nur erzeugt, wenn <code>title=</code> Text enthält.</p><p><code>{CBList id=15 title=&quot;Anmeldungen&quot; card=h1}</code></p><p>Farben können in der Joomla-Datei <code>user.css</code> überschrieben werden: <code>.cb-card-h1 { --cb-card-header-bg: #005a9c; --cb-card-header-color: #fff; }</code></p>"
