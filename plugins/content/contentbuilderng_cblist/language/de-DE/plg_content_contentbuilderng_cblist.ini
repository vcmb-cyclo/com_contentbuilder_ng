PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="Bindet mit dem Tag {CBList} eine interaktive ContentBuilder-NG-Listenansicht in Joomla-Inhalte ein."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="{CBList}-Syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>Fügen Sie <code>{CBList id=25}</code> in einen Joomla-Artikel ein, um die ContentBuilder-NG-Listenansicht mit der Kennung 25 einzubetten.</p><p>Optionale Parameter: <code>itemid</code> wendet die Einstellungen eines ContentBuilder-NG-Menüeintrags an; <code>layout</code> wählt ein Listenlayout aus; <code>height</code> legt die minimale Rahmenhöhe zwischen 240 und 5.000 Pixeln fest; <code>loading</code> akzeptiert <code>lazy</code> oder <code>eager</code>; <code>title</code> legt den barrierefreien Rahmentitel fest.</p><p>Beispiel: <code>{CBList id=25 itemid=142 layout=cards height=700 title=&quot;Anmeldungen&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_INVALID_TAG="Das CBList-Tag ist ungültig. Eine positive Ansichtskennung ist erforderlich."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_IFRAME_TITLE="ContentBuilder-NG-Listenansicht %d"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_OPEN_LIST="Liste auf einer separaten Seite öffnen"
