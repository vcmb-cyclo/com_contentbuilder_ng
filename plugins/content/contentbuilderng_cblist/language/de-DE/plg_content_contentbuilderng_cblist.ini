PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="CBList zeigt eine interaktive ContentBuilder-NG-Listenansicht direkt in einem Joomla-Artikel an und behält dabei die Zugriffsrechte und die Konfiguration der Ansicht bei. Einfaches Beispiel: {CBList id=15}. Alle Syntaxoptionen finden Sie in der nachfolgenden Beschreibung."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList: Zweck, Syntax und wichtigste Optionen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>CBList zeigt eine ContentBuilder-NG-Listenansicht direkt in einem Joomla-Artikel an. Die Liste behält die Zugriffsrechte und die Konfiguration der Ansicht.</p><p><strong>Einfaches Beispiel:</strong><br><code>{CBList id=15}</code><br>Dieses Beispiel zeigt Ansicht 15 mit den in ContentBuilder NG konfigurierten Spalten, Titel-, Sortier-, Seiten-, Aktions-, Layout- und Themeneinstellungen, ohne CBList-Anpassung.</p><p><strong>Wichtigste Optionen:</strong></p><ul><li><code>id=15</code>: anzuzeigende ContentBuilder-NG-Ansicht. Diese Option ist erforderlich.</li><li><code>fields=&quot;Name|Vorname|E-Mail&quot;</code>: wählt die angezeigten Spalten und ihre Reihenfolge.</li><li><code>title=&quot;Teilnehmerliste&quot;</code>: ersetzt den sichtbaren Ansichtstitel. Ohne <code>title</code> bleibt der konfigurierte Titel erhalten. Verwenden Sie <code>title=hide</code> oder das gleichwertige <code>title=&quot;&quot;</code>, um den CB-Titel auszublenden.</li><li><code>sort=&quot;Name|Vorname&quot; dir=&quot;asc&quot;</code>: sortiert alle genannten Felder zunächst aufsteigend. Eine einzelne Richtung gilt für alle Sortierfelder.</li><li><code>pagination=25</code>: zeigt 25 Datensätze pro Seite.</li><li><code>actions=&quot;detail|edit|export&quot;</code>: wählt die für den Benutzer verfügbaren Steuerelemente im Rahmen der Ansichtsrechte.</li><li><code>layout=cards</code>: zeigt Datensätze als Karten statt in der Standardtabelle. Dies ist der lesbare Alias von <code>listcard</code>.</li><li><code>height=700</code>: legt eine anfängliche Mindesthöhe von 700 Pixeln fest. Der Rahmen kann bei Bedarf automatisch wachsen.</li><li><code>loading=lazy</code>: Standardwert; lädt die Liste, wenn sie sich dem sichtbaren Bereich nähert. <code>loading=eager</code> lädt sie sofort.</li></ul><p><strong>Realistisches Beispiel:</strong><br><code>{CBList id=15 fields=&quot;Name|Vorname|E-Mail&quot; title=&quot;Teilnehmerliste&quot; sort=&quot;Name|Vorname&quot; dir=&quot;asc&quot; pagination=25 actions=&quot;detail|edit|export&quot; layout=cards height=700 loading=lazy}</code></p><p><strong>Theme:</strong> CBList verwendet das in der ContentBuilder-NG-Ansicht konfigurierte Theme. <strong>Thoth</strong> ist das Standard- und Fallback-Theme. Das CBList-Tag besitzt keine Option <code>theme=</code>.</p><p>CBList und CBStats können im selben Artikel kombiniert werden, beispielsweise ein Übersichtsdiagramm mit der zugehörigen Detailliste.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — angezeigte Spalten filtern und ordnen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> wählt die anzuzeigenden Spalten und ihre Reihenfolge aus den in der ContentBuilder-NG-Ansicht verfügbaren Feldern. Verwenden Sie ausschließlich exakte, groß-/kleinschreibungssensitive Quellelementnamen oder exakte Referenz-IDs. Anzeigebezeichnungen sowie Akzent- oder Schreibweisenvarianten werden abgelehnt. Trennen Sie Werte mit <code>|</code>.</p><p><strong>Drei angezeigte Spalten:</strong><br><code>{CBList id=15 fields=&quot;Name|Vorname|Email&quot;}</code></p><p><strong>Spalten mit Sortierung und Seitengröße:</strong><br><code>{CBList id=15 fields=&quot;Name|Vorname|Email&quot; sort=&quot;Name|Vorname&quot; dir=&quot;asc&quot; pagination=25}</code></p><p>Ein einzelnes <code>dir=&quot;asc&quot;</code> oder <code>dir=&quot;desc&quot;</code> gilt für alle Felder in <code>sort</code>. Für gemischte Richtungen wird pro Feld ein Wert angegeben, zum Beispiel <code>dir=&quot;asc|desc&quot;</code>. <code>title=&quot;Teilnehmerliste&quot;</code> ersetzt den sichtbaren Titel; <code>title=hide</code> blendet ihn vollständig aus. <code>title=&quot;&quot;</code> ist gleichwertig. <code>layout</code>, <code>height</code> und <code>loading</code> steuern die Darstellung wie oben beschrieben.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — verfügbare Aktionen auswählen"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> wählt die in den eingebetteten Listen-, Detail- und Bearbeitungsansichten verfügbaren Steuerelemente. Ohne diese Option bleiben alle durch die Ansichtsrechte bereits erlaubten Steuerelemente verfügbar. Die Option gewährt niemals ein von der Ansicht verweigertes Recht.</p><p><strong>Verfügbare Aktionen:</strong></p><ul><li><code>search</code>: zeigt die Such- und Filterleiste an.</li><li><code>state</code>: zeigt den Workflow-Statusfilter und das Steuerelement an.</li><li><code>publish</code>: zeigt Filter und Steuerung für Veröffentlichen oder Zurückziehen an.</li><li><code>language</code>: zeigt den Sprachfilter an.</li><li><code>new</code>: erlaubt das Erstellen eines neuen Datensatzes.</li><li><code>edit</code>: erlaubt das Öffnen der Bearbeitungsansicht eines Datensatzes.</li><li><code>delete</code>: erlaubt das Löschen von Datensätzen.</li><li><code>export</code>: zeigt die Exportschaltfläche an.</li><li><code>rating</code>: zeigt und erlaubt die Bewertungssteuerung.</li><li><code>detail</code>: erlaubt das Öffnen der Detailansicht eines Datensatzes.</li><li><code>print</code>: zeigt die Druckschaltfläche in der Detailansicht an.</li></ul><p>Trennen Sie Aktionen mit <code>|</code>.</p><p><code>{CBList id=15 actions=&quot;detail|edit|export&quot;}</code><br><code>{CBList id=15 fields=&quot;Name|Vorname|E-Mail&quot; actions=&quot;search|detail|edit|export&quot;}</code></p>"
