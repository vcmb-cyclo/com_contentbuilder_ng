PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="Embeds an interactive ContentBuilder NG list view in Joomla content with the {CBList} tag."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="{CBList} syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>Insert <code>{CBList id=25}</code> in a Joomla article to embed the ContentBuilder NG list view with identifier 25.</p><p>Optional parameters: <code>itemid</code> applies the settings of a ContentBuilder NG menu item; <code>layout</code> selects a list layout; <code>height</code> sets the minimum frame height from 240 to 5000 pixels; <code>loading</code> accepts <code>lazy</code> or <code>eager</code>; <code>title</code> sets the accessible frame title.</p><p>Example: <code>{CBList id=25 itemid=142 layout=cards height=700 title=&quot;Registrations&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_INVALID_TAG="The CBList tag is invalid. A positive view id is required."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_IFRAME_TITLE="ContentBuilder NG list view %d"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_OPEN_LIST="Open the list in a separate page"
