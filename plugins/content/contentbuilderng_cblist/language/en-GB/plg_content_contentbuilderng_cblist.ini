PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="CBList displays an interactive ContentBuilder NG list view directly inside a Joomla article while preserving the view's access rights and configuration. Simple example: {CBList id=15}. See the description below for all syntax options."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList: purpose, syntax and main options"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_PAGINATION_LABEL="Pagination and result limiting"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_PAGINATION_TEXT="<p><code>pagination=20</code> splits the list into pages of 20 rows. <code>pagination=0</code> keeps the view row count but hides the selector and pagination links.</p><p><code>limit=100</code> caps the result at 100 rows after ACLs, search, filters and sorting. With <code>pagination=20</code>, this gives at most 5 pages. Export uses the same capped result. Numbers are written without quotes.</p><p><strong>Examples:</strong><br><code>{CBList id=15 pagination=20 limit=100}</code><br><code>{CBList id=15 actions=none pagination=0 limit=10}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LAYOUT_LABEL="Layout, height and loading"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LAYOUT_TEXT="<p><code>layout=</code> accepts <code>default</code>, <code>cards</code>, <code>listone</code>, <code>listtwo</code>, <code>listthree</code>, <code>listcard</code>, <code>listcompact</code> or <code>listtiles</code>. <code>cards</code> aliases <code>listcard</code>. This controls internal rows; <code>card=h1…h6</code> or <code>card=v1…v6</code> wraps the complete tag.</p><p><code>height=700</code> sets the iframe’s initial minimum height from 240 to 5000 pixels. <code>loading=lazy</code> loads near the viewport; <code>loading=eager</code> loads immediately.</p><p><strong>Examples:</strong><br><code>{CBList id=15 layout=cards height=700 loading=lazy}</code><br><code>{CBList id=15 layout=listcompact loading=eager}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_REFERENCE_LABEL="Complete option reference"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_REFERENCE_TEXT="<p><strong>Source:</strong> <code>id</code>. <strong>Columns and sorting:</strong> <code>fields</code>, <code>sort</code>, <code>dir</code>. <strong>Volume:</strong> <code>pagination</code>, <code>limit</code>. <strong>Controls:</strong> <code>actions</code>. <strong>Presentation:</strong> <code>labels</code>, <code>hide</code>, <code>layout</code>, <code>height</code>, <code>loading</code>, <code>card</code>. <strong>Single value:</strong> <code>output</code>, <code>offset</code>.</p><p>An error identifies the option, its value and the expected rule. ACLs always remain authoritative.</p><p><strong>Complete example:</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc|desc&quot; pagination=20 limit=100 actions=&quot;search|detail|export&quot; labels=&quot;title=Registrations&quot; layout=cards height=700 loading=lazy card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>CBList displays a ContentBuilder NG list view directly inside a Joomla article. The list keeps the view's access rights and configuration.</p><p><strong>Simple example:</strong><br><code>{CBList id=15}</code><br>This displays view 15 as configured in ContentBuilder NG, without filtering its columns or overriding its title, sorting, pagination, actions, layout or theme.</p><p>Numeric options <code>id</code>, <code>height</code>, <code>pagination</code> and <code>limit</code> must be written without quotation marks.</p><p><strong>Main options:</strong></p><ul><li><code>id=xx</code>: the ContentBuilder NG view to display. This option is required.</li><li><code>fields=&quot;Nom|Prenom|Email&quot;</code>: selects the columns to display and their order.</li><li><code>labels=&quot;title=Registration list&quot;</code>: replaces the visible view title and supplies the Card title when <code>card=</code> is used. Omit <code>labels</code> to keep the configured view title. Use <code>hide=&quot;title&quot;</code> to hide either title. Only one non-empty <code>title</code> key is accepted.</li><li><code>sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot;</code>: initially sorts all named fields in ascending order. A single direction applies to every sort field.</li><li><code>pagination=25</code>: displays 25 records per page.</li><li><code>limit=10</code>: keeps at most the first 10 accessible records after ACLs, search, filters and sorting. Pagination and export apply to this limited subset.</li><li><code>actions=&quot;detail|edit|export&quot;</code>: selects the controls available to the user, within the view's access rights.</li><li><code>layout=cards</code>: displays records as cards instead of the standard table. It is the readable alias of <code>listcard</code>.</li><li><code>height=700</code>: sets an initial minimum iframe height of 700 pixels. The frame can grow automatically when more room is needed.</li><li><code>loading=lazy</code>: the default; loads the list when it approaches the visible area. Use <code>loading=eager</code> to load it immediately.</li></ul><p><strong>Realistic example:</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; labels=&quot;title=Registration list&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot; pagination=25 limit=10 actions=&quot;detail|edit|export&quot; layout=cards height=700 loading=lazy}</code></p><p><strong>Theme:</strong> CBList uses the theme configured in the ContentBuilder NG view. <strong>Thoth</strong> is the default and fallback theme. There is no <code>theme=</code> option in the CBList tag.</p><p>CBList and CBStats can be used together in the same article, for example a summary chart followed by the detailed list of records.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — filtering and ordering displayed columns"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_VALUE_LABEL="output=value — returning one text value"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_VALUE_TEXT="<p><code>{CBList id=15 fields=&quot;Nom&quot; output=value}</code> returns only the latest value of the <code>Nom</code> field as Unicode text, without an iframe. All CB ACLs, restrictions, searches and filters are applied before sorting.</p><p>This mode defaults to <code>sort=ID dir=desc offset=0</code>. Use <code>offset=1</code> for the previous result, or explicitly select another sort field and <code>dir=asc</code> or <code>dir=desc</code>. <code>fields</code> must contain exactly one field. <code>offset</code> is an unquoted integer from 0 to 4,999.</p><p><code>pagination</code>, <code>actions</code>, <code>labels</code>, <code>hide</code>, <code>layout</code>, <code>height</code> and <code>loading</code> are rejected with <code>output=value</code>. CBList returns nothing when there is no result. In normal list output, <code>pagination=0</code> hides the selector and pagination controls without changing the number of rows.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> selects the columns to display and their order from the fields available in the ContentBuilder NG view. Use only exact, case-sensitive source element names or exact reference IDs. Display labels and accent or case variants are rejected. Separate values with <code>|</code>. An existing element named in <code>fields</code> remains valid when it is unpublished or disabled for list display; ContentBuilder simply omits that column without reporting a syntax error.</p><p><strong>Three displayed columns:</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot;}</code></p><p><strong>Displayed columns with sorting and pagination:</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot; pagination=25}</code></p><p>A single <code>dir=&quot;asc&quot;</code> or <code>dir=&quot;desc&quot;</code> applies to every field in <code>sort</code>. To mix directions, provide one direction per field, for example <code>dir=&quot;asc|desc&quot;</code>. Add <code>labels=&quot;title=Registration list&quot;</code> to replace the visible title or <code>hide=&quot;title&quot;</code> to hide it completely. <code>layout</code>, <code>height</code> and <code>loading</code> control the list presentation as explained above.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — choosing available controls"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> selects which controls are available in the embedded list, detail and edit screens. Without this option, all controls already permitted by the view's access rights remain available. The option never grants a right that the view denies.</p><p><strong>Available actions:</strong></p><ul><li><code>search</code>: displays the search and filter bar.</li><li><code>state</code>: displays the workflow state filter and control.</li><li><code>publish</code>: displays the publish/unpublish filter and control.</li><li><code>language</code>: displays the language filter.</li><li><code>new</code>: allows creating a new record.</li><li><code>edit</code>: allows opening the edit screen for an existing record.</li><li><code>delete</code>: allows deleting records.</li><li><code>export</code>: displays the export button.</li><li><code>rating</code>: displays and allows the rating control.</li><li><code>detail</code>: allows opening the record detail screen.</li><li><code>print</code>: displays the print button on the detail screen.</li></ul><p>Separate actions with <code>|</code>.</p><p><code>{CBList id=15 actions=&quot;detail|edit|export&quot;}</code><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; actions=&quot;search|detail|edit|export&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_VALIDATION_INTRO="CBList cannot be displayed. Correction required:"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_NONE_LABEL="actions=none — hiding every list control"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_NONE_TEXT="<p><code>actions=none</code> hides and disables every CBList action: search and filters, new, detail, edit, delete, export, rating and print. Omitting <code>actions</code> or using <code>actions=&quot;&quot;</code> keeps the view settings.</p><p>Pagination controls are separate. To display data without any controls at the top or bottom, use:<br><code>{CBList id=15 actions=none pagination=0}</code></p><p><code>none</code> cannot be combined with another action.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_SYNTAX_HELP="CBList syntax help"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EMPTY_VALUE="empty value"
