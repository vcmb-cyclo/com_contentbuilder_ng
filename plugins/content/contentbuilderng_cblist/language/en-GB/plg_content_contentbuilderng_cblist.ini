PLG_CONTENT_CONTENTBUILDERNG_CBLIST_INVALID_OPTION_VALUE="The CBList parameter \"%1$s\" contains the invalid value \"%2$s\". %3$s"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_UNKNOWN_ACTION="The CBList parameter \"actions\" contains the unknown action \"%s\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_UNKNOWN_VIEW="The CBList parameter \"id\" contains \"%s\", which does not match any ContentBuilder NG view."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_ID="Enter the positive integer ID of an existing ContentBuilder NG view, for example id=15."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_NUMERIC_SYNTAX="Write numeric options without quotation marks, for example id=15, pagination=20, limit=10 or offset=1."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_HEIGHT="Enter a whole number from 240 to 5000 pixels."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_PAGINATION="Enter 0 to hide the controls, or a whole number from 1 to 5000 records per page."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LIMIT="Enter a whole number from 1 to 5000 displayed records."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OFFSET="Enter an unquoted whole number from 0 to 4999."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OUTPUT="Allowed values: list or value."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_SINGLE_FIELD="With output=value, fields must contain exactly one field."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OUTPUT_COMPATIBILITY="This presentation option cannot be used with output=value."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_OFFSET_MODE="offset can only be used with output=value."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LAYOUT="Allowed values: default, cards, listone, listtwo, listthree, listcard, listcompact or listtiles."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LOADING="Allowed values: lazy or eager."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_FIELDS="Separate exact, case-sensitive source element names or exact reference IDs with |, for example fields=\"Nom|Prenom|Email\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LABELS="Use one non-empty title mapping, for example labels=\"title=Registration list\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_LABELS_TITLE="Use labels=\"title=...\", for example labels=\"title=Registration list\". Use hide=\"title\" to hide the title."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_HIDE="Use hide=\"title\". No other value is allowed."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_ACTIONS="Use none alone, or separate actions with |. Allowed actions: search, state, publish, language, new, edit, delete, export, rating, detail and print."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_SORT="Separate exact, case-sensitive source element names or exact reference IDs with |, for example sort=\"Nom|Prenom\"."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_DIR="Use asc or desc. One value applies to every sort column."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_DIR_COUNT="Provide either one direction for all sort columns, or one direction per column separated with |."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_IFRAME_TITLE="ContentBuilder NG list view %d"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_OPEN_LIST="Open the list in a separate page"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_CARD="Use card=h1 to card=h6 or card=v1 to card=v6."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_W="Use w=33, w=66 or w=100 without quotation marks."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_EXPECTED_W_CARD="The w option requires a valid card option."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_WIDTH_LABEL="Card widths"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_WIDTH_TEXT="<p>Inside a <code>cb-cards</code> container, add <code>w=33</code> for one column, <code>w=66</code> for two columns or <code>w=100</code> for the complete row. Write the value without quotation marks and only with <code>card=</code>. Without <code>w=</code>, a V Card uses 33 and an H Card uses 100. All Cards become full-width on small screens.</p><p><strong>Example:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBList id=15 labels=&quot;title=Short list&quot; card=v1 w=33}<br>{CBList id=15 labels=&quot;title=Wide list&quot; card=v2 w=66}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_LABEL="Optional shared ContentBuilder NG Card"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_CUSTOMIZE_LABEL="Customising Cards"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_GRID_LABEL="Placing V Cards side by side"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ARTICLE_EXAMPLE_LABEL="Complete two-row article example"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ARTICLE_EXAMPLE_TEXT="<p>One <code>cb-cards</code> container can hold six V Cards: the first three use the first row and the next three automatically move to the second. Do not add <code>&lt;br&gt;</code> or another container between them. A standalone H Card needs no container.</p><p><strong>Paste this in the Joomla editor’s HTML mode, without Markdown ``` markers:</strong></p><p><code>&lt;h2&gt;Dashboard&lt;/h2&gt;<br>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Group output=pie labels=&quot;title=Groups&quot; card=v1}<br>{CBStats id=15 field=FirstName output=bar labels=&quot;title=First names&quot; card=v2}<br>{CBStats id=15 field=Group output=table labels=&quot;title=Details&quot; card=v3}<br>{CBStats id=15 field=Town output=pie labels=&quot;title=Towns&quot; card=v4}<br>{CBStats id=15 field=Age output=histogram groups=&quot;18-29;30-39;40-49;50+&quot; labels=&quot;title=Ages&quot; card=v5}<br>{CBStats id=15 output=total labels=&quot;title=Total&quot; card=v1}<br>&lt;/div&gt;<br>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; labels=&quot;title=Latest records&quot; sort=ID dir=desc limit=10 card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_GRID_TEXT="<p>Put every V Card to be aligned inside one <code>&lt;div class=&quot;cb-cards&quot;&gt;</code> container, with no <code>&lt;br&gt;</code> between tags. On desktop it uses three columns; on small screens one. An H Card directly inside the container spans the complete row.</p><p><strong>Example:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBList id=15 labels=&quot;title=List 1&quot; card=v1}<br>{CBList id=15 labels=&quot;title=List 2&quot; card=v2}<br>{CBList id=15 labels=&quot;title=List 3&quot; card=v3}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_CUSTOMIZE_TEXT="<p><strong>For the whole site:</strong> add <code>.cb-card-h1 { --cb-card-accent: #005a9c; --cb-card-header-color: #fff; }</code> to the Joomla template’s <code>user.css</code>. This changes every H1 Card. Replace <code>h1</code> with the required H/V variant.</p><p><strong>For one article only:</strong> wrap the tags in <code>&lt;div class=&quot;my-cards&quot;&gt;…&lt;/div&gt;</code>, then add <code>&lt;style&gt;.my-cards .cb-card-h1 { --cb-card-accent: #005a9c; }&lt;/style&gt;</code> in the article when its editor and site policy allow style elements. The wrapper prevents the override from affecting other pages.</p><p><code>--cb-card-accent</code> controls the header colour. Advanced overrides can use <code>--cb-card-header-bg</code>, <code>--cb-card-header-color</code>, <code>--cb-card-bg</code>, <code>--cb-card-color</code> and <code>--cb-card-border-color</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_CARD_TEXT="<p><code>card=h1</code> to <code>card=h6</code> or <code>card=v1</code> to <code>card=v6</code> adds a coloured Card. For every variant, the title is horizontal and above the content. The <code>title</code> key in <code>labels=</code> supplies the Card heading; <code>hide=&quot;title&quot;</code> hides it.</p><p>Card titles use <code>h4</code> by default. Add <code>|h1</code> to <code>|h6</code> after the title to select a heading level, or <code>|remX</code> / <code>|remX.X</code> to set a positive visual size while keeping the semantic <code>h4</code> level. Spaces around the last <code>|</code> are optional and suffixes are case-insensitive. An unrecognised suffix remains part of the complete title, which uses the default <code>h4</code> rendering.</p><p><code>{CBList id=15 labels=&quot;title=Registrations | h4&quot; card=h1}</code><br><code>{CBList id=15 labels=&quot;title=Registrations | rem1.25&quot; card=h1}</code><br><code>{CBList id=15 labels=&quot;title=Registrations&quot; hide=&quot;title&quot; card=h1}</code></p><p>Override colours in Joomla <code>user.css</code>: <code>.cb-card-h1 { --cb-card-header-bg: #005a9c; --cb-card-header-color: #fff; }</code></p>"
