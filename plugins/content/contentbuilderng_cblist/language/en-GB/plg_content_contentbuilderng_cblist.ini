PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="Embeds an interactive ContentBuilder NG list view in Joomla content with the {CBList} tag. fields= restricts the visible columns and actions= restricts the available controls, both without ever widening what ACL already permits."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList: purpose and syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>Insert <code>{CBList id=15}</code> in a Joomla article to embed the ContentBuilder NG list view with identifier 25. Depending on the current user's permissions, the embedded frame lets a reader search, sort, page through records, and reach the detail or edit screens for a record — all without leaving the page.</p><p><strong>Core parameters:</strong> <code>layout</code> selects one of the list layouts defined for the view, for example <code>cards</code>; <code>height</code> sets the frame's minimum height in pixels, from 240 to 5000, and the frame grows past it if the content needs more room; <code>loading</code> controls when the browser fetches the frame: <code>lazy</code>, the default, defers loading until the frame nears the visible viewport, while <code>eager</code> loads it immediately together with the rest of the page; <code>title</code> sets the frame's accessible title — read by screen readers and shown as a tooltip, it does not add a visible on-page heading.</p><p><strong>Simple examples:</strong><br><code>{CBList id=15}</code><br><code>{CBList id=25 layout=cards height=700}</code><br><code>{CBList id=25 loading=eager title=&quot;Registrations&quot;}</code></p><p>The <code>pagination=25</code> option displays 25 records per page. See the <strong>fields=</strong> and <strong>actions=</strong> notes below to narrow which columns and controls are shown. Both only ever narrow what the current user's ACL permissions already allow for this view; neither can grant anything ACL denies.</p><p><code>sort=</code> accepts one or more field names, reference IDs or exact labels separated by <code>|</code>. <code>dir=</code> must contain exactly one matching <code>asc</code> or <code>desc</code> value per sort field. Example: <code>{CBList id=15 fields=Name|Email sort=Name|Email dir=asc|desc}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — restricting visible columns"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> keeps only the named columns among those already visible and allowed for the current user in this view. It can only hide columns; it can never reveal a column the view itself does not already show.</p><p>Selectors are separated by <code>|</code>, the same convention as <code>{CBStats hide=...}</code>; commas and semicolons are rejected rather than silently treated as an alternate separator, since a field label can itself legitimately contain a comma. Each selector may be a source field name, a reference identifier, or the exact column label; matching is case-insensitive, and the selectors' order determines the column order.</p><p><code>{CBList id=25 fields=&quot;Name|Email|Town&quot;}</code><br><code>{CBList id=25 fields=&quot;12|Email|Town&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — restricting available controls"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> is an allow-list: as soon as it is set, nothing is enabled except the actions explicitly named — on the list, detail and edit screens alike. Leaving it out enables every control ACL already allows, exactly as before this parameter existed.</p><p><strong>The exhaustive set of controllable actions:</strong></p><ul><li><code>search</code>: the search/filter bar.</li><li><code>state</code>: the workflow state filter and control.</li><li><code>publish</code>: the publish/unpublish filter and toggle.</li><li><code>language</code>: the language filter.</li><li><code>new</code>: creating a new record.</li><li><code>edit</code>: opening or reaching the edit screen for an existing record.</li><li><code>delete</code>: the delete action.</li><li><code>export</code>: the export button.</li><li><code>rating</code>: the rating control and display.</li><li><code>detail</code>: opening the detail (view) screen.</li><li><code>print</code>: the print button on the detail screen.</li></ul><p>This never widens what ACL permits: an action left out of <code>actions=</code> stays hidden even where ACL would allow it, but an action listed in <code>actions=</code> still requires the matching ACL permission to appear or to be reachable at all. A hand-typed URL to the edit or detail screen is blocked exactly as the hidden button would have been — hiding a control is never the only line of defence.</p><p>Selectors are separated by <code>|</code>, like <code>fields=</code>; commas and semicolons are rejected.</p><p><code>{CBList id=25 actions=&quot;search|detail|export&quot;}</code><br><code>{CBList id=25 actions=&quot;new|edit|delete&quot;}</code></p>"
