PLG_CONTENT_CONTENTBUILDERNG_CBLIST_XML_DESCRIPTION="CBList displays an interactive ContentBuilder NG list view directly inside a Joomla article while preserving the view's access rights and configuration. Simple example: {CBList id=15}. See the description below for all syntax options."
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_LABEL="CBList: purpose, syntax and main options"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_TEXT="<p>CBList displays a ContentBuilder NG list view directly inside a Joomla article. The list keeps the view's access rights and configuration.</p><p><strong>Simple example:</strong><br><code>{CBList id=15}</code><br>This displays view 15 as configured in ContentBuilder NG, without filtering its columns or overriding its title, sorting, pagination, actions, layout or theme.</p><p><strong>Main options:</strong></p><ul><li><code>id=15</code>: the ContentBuilder NG view to display. This option is required.</li><li><code>fields=&quot;Nom|Prenom|Email&quot;</code>: selects the columns to display and their order.</li><li><code>title=&quot;Registration list&quot;</code>: replaces the visible view title. Omit <code>title</code> to keep the configured title. Use <code>title=hide</code>, or the equivalent <code>title=&quot;&quot;</code>, to hide the CB title.</li><li><code>sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot;</code>: initially sorts all named fields in ascending order. A single direction applies to every sort field.</li><li><code>pagination=25</code>: displays 25 records per page.</li><li><code>actions=&quot;detail|edit|export&quot;</code>: selects the controls available to the user, within the view's access rights.</li><li><code>layout=cards</code>: displays records as cards instead of the standard table. It is the readable alias of <code>listcard</code>.</li><li><code>height=700</code>: sets an initial minimum iframe height of 700 pixels. The frame can grow automatically when more room is needed.</li><li><code>loading=lazy</code>: the default; loads the list when it approaches the visible area. Use <code>loading=eager</code> to load it immediately.</li></ul><p><strong>Realistic example:</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; title=&quot;Registration list&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot; pagination=25 actions=&quot;detail|edit|export&quot; layout=cards height=700 loading=lazy}</code></p><p><strong>Theme:</strong> CBList uses the theme configured in the ContentBuilder NG view. <strong>Thoth</strong> is the default and fallback theme. There is no <code>theme=</code> option in the CBList tag.</p><p>CBList and CBStats can be used together in the same article, for example a summary chart followed by the detailed list of records.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_LABEL="fields= — filtering and ordering displayed columns"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_FIELDS_TEXT="<p><code>fields=</code> selects the columns to display and their order from the fields available in the ContentBuilder NG view. Use only exact, case-sensitive source element names or exact reference IDs. Display labels and accent or case variants are rejected. Separate values with <code>|</code>.</p><p><strong>Three displayed columns:</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot;}</code></p><p><strong>Displayed columns with sorting and pagination:</strong><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; sort=&quot;Nom|Prenom&quot; dir=&quot;asc&quot; pagination=25}</code></p><p>A single <code>dir=&quot;asc&quot;</code> or <code>dir=&quot;desc&quot;</code> applies to every field in <code>sort</code>. To mix directions, provide one direction per field, for example <code>dir=&quot;asc|desc&quot;</code>. Add <code>title=&quot;Registration list&quot;</code> to replace the visible title or <code>title=hide</code> to hide it completely. <code>title=&quot;&quot;</code> is equivalent. <code>layout</code>, <code>height</code> and <code>loading</code> control the list presentation as explained above.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_LABEL="actions= — choosing available controls"
PLG_CONTENT_CONTENTBUILDERNG_CBLIST_HELP_ACTIONS_TEXT="<p><code>actions=</code> selects which controls are available in the embedded list, detail and edit screens. Without this option, all controls already permitted by the view's access rights remain available. The option never grants a right that the view denies.</p><p><strong>Available actions:</strong></p><ul><li><code>search</code>: displays the search and filter bar.</li><li><code>state</code>: displays the workflow state filter and control.</li><li><code>publish</code>: displays the publish/unpublish filter and control.</li><li><code>language</code>: displays the language filter.</li><li><code>new</code>: allows creating a new record.</li><li><code>edit</code>: allows opening the edit screen for an existing record.</li><li><code>delete</code>: allows deleting records.</li><li><code>export</code>: displays the export button.</li><li><code>rating</code>: displays and allows the rating control.</li><li><code>detail</code>: allows opening the record detail screen.</li><li><code>print</code>: displays the print button on the detail screen.</li></ul><p>Separate actions with <code>|</code>.</p><p><code>{CBList id=15 actions=&quot;detail|edit|export&quot;}</code><br><code>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; actions=&quot;search|detail|edit|export&quot;}</code></p>"
