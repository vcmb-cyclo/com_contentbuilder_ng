PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_XML_DESCRIPTION="CBStats zeigt dynamische Statistiken aus ContentBuilder-NG-Ansichten direkt in Joomla-Artikeln an und behält dabei die Zugriffsrechte und die Konfiguration der Ansichten bei. Einfaches Beispiel: {CBStats id=15 output=total}. Alle Syntaxoptionen finden Sie in der nachfolgenden Beschreibung."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_CARD="Verwenden Sie card=h1 bis card=h6 oder card=v1 bis card=v6."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_W="Verwenden Sie w=33, w=66 oder w=100 ohne Anführungszeichen."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_W_CARD="Die Option w erfordert eine gültige card-Option."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_WIDTH_LABEL="Card-Breiten"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_WIDTH_TEXT="<p>In <code>cb-cards</code> belegt <code>w=33</code> eine Spalte, <code>w=66</code> zwei Spalten und <code>w=100</code> die gesamte Zeile. Schreiben Sie den Wert ohne Anführungszeichen und verwenden Sie ihn nur mit <code>card=</code>. Ohne <code>w=</code> verwendet V den Wert 33 und H den Wert 100. Auf kleinen Bildschirmen verwenden alle Cards 100 %. Bei zu wenig Platz beginnt die Card in der nächsten Zeile.</p><p><code>w=</code> steuert die Card; <code>width=</code> steuert das Diagramm darin.</p><p><strong>Beispiel:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Gruppe output=pie title=&quot;Gruppen&quot; card=v1 w=33}<br>{CBStats id=15 field=Vorname output=bar title=&quot;Vornamen&quot; card=v2 w=66 width=100%}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_WIDTH="Verwenden Sie eine Zahl, optional gefolgt von px oder %, zum Beispiel width=350, width=350px oder width=80%."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_HEIGHT="Verwenden Sie eine Zahl, optional gefolgt von px oder %, zum Beispiel height=280, height=280px oder height=80%."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_LABEL="Optionale gemeinsame ContentBuilder-NG-Card"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EDITORIAL_CARD_LABEL="Redaktionelle Card für freie Inhalte"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EDITORIAL_CARD_TEXT="<p>Eine redaktionelle Card gruppiert freies HTML sowie CBStats- und CBList-Tags, ohne dass die vollständige Card-Struktur geschrieben werden muss. Verwenden Sie die empfohlene vollständige Syntax: <code>&lt;div class=&quot;cb-card-editorial&quot; data-card=&quot;v1&quot; data-w=&quot;33&quot;&gt;…&lt;/div&gt;</code>.</p><p>Ein direktes Element <code>&lt;h1&gt;</code> bis <code>&lt;h6 data-cb-card-title&gt;</code> wird zum farbigen Card-Kopfbereich und bleibt im visuellen Editor sichtbar. Eine Hx-Überschrift ohne dieses Attribut bleibt im Inhalt. Die bisherige Syntax <code>data-title</code> wird mit ihren gemeinsamen Suffixen <code>|h1</code> bis <code>|h6</code> sowie positivem <code>|remX</code> weiterhin unterstützt. Ohne eine dieser Titelformen wird kein Kopfbereich ausgegeben. <code>data-card</code> akzeptiert <code>h1</code>–<code>h6</code> und <code>v1</code>–<code>v6</code>; Standard ist <code>v1</code>. <code>data-w</code> akzeptiert <code>33</code>, <code>66</code> oder <code>100</code>; Standard ist <code>33</code>. Ungültige Card- oder Breitenwerte verwenden diese sicheren Standards.</p><p><strong>Beispiel:</strong><br><code>&lt;div class=&quot;cb-card-editorial&quot; data-card=&quot;v1&quot; data-w=&quot;33&quot;&gt;<br>&lt;h4 data-cb-card-title&gt;Informationen&lt;/h4&gt;<br>&lt;p&gt;Gesamt: {CBStats id=15 output=total}&lt;/p&gt;<br>&lt;p&gt;Eindeutige Gruppen: {CBStats id=15 field=Gruppe output=distinct}&lt;/p&gt;<br>{CBList id=15 fields=&quot;Nom|Prenom&quot; limit=5}<br>&lt;/div&gt;</code></p><p>Das standardmäßige HTML-Markup wird von TinyMCE und JCE beibehalten. Die Ausgabe verwendet das vorhandene gemeinsame Card-CSS und entfernt leere Textknoten oder Textknoten aus geschützten Leerzeichen zwischen Cards in einem <code>cb-cards</code>-Raster.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_CUSTOMIZE_LABEL="Cards anpassen"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_GRID_LABEL="V-Cards nebeneinander anordnen"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ARTICLE_EXAMPLE_LABEL="Vollständiges Artikelbeispiel mit zwei Zeilen"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ARTICLE_EXAMPLE_TEXT="<p>Setzen Sie bis zu sechs V-Cards in einen gemeinsamen <code>cb-cards</code>-Container. Die ersten drei bilden die erste Zeile, die nächsten die zweite. Fügen Sie kein <code>&lt;br&gt;</code> ein und schließen Sie den Container nicht zwischen den Zeilen. Eine einzelne H-Card kann direkt folgen.</p><p><strong>Joomla-HTML-Beispiel ohne Markdown-```-Markierungen:</strong></p><p><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Gruppe output=pie title=&quot;Gruppen&quot; card=v1}<br>{CBStats id=15 field=Vorname output=bar title=&quot;Vornamen&quot; card=v2}<br>{CBStats id=15 field=Gruppe output=table title=&quot;Details&quot; card=v3}<br>{CBStats id=15 field=Ort output=pie title=&quot;Orte&quot; card=v4}<br>{CBStats id=15 field=Alter output=histogram groups=&quot;18-29;30-39;40-49;50+&quot; title=&quot;Alter&quot; card=v5}<br>{CBStats id=15 output=total title=&quot;Summe&quot; card=v1}<br>&lt;/div&gt;<br>{CBList id=15 fields=&quot;Name|Vorname|Email&quot; title=&quot;Neueste Datensätze&quot; sort=ID dir=desc limit=10 card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_GRID_TEXT="<p>Setzen Sie alle drei Tags in einen gemeinsamen Container <code>&lt;div class=&quot;cb-cards&quot;&gt;</code>, ohne <code>&lt;br&gt;</code> und ohne den Container zwischen den Tags zu schließen. Auf dem Desktop verwenden V-Cards drei Spalten, auf kleinen Bildschirmen eine. Eine H-Card belegt die vollständige Zeile.</p><p><strong>Beispiel:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Gruppe output=pie title=&quot;Gruppen&quot; card=v1}<br>{CBStats id=15 field=Vorname output=bar title=&quot;Vornamen&quot; card=v2}<br>{CBStats id=15 field=Gruppe output=table title=&quot;Details&quot; card=v3}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_CUSTOMIZE_TEXT="<p><strong>Für die gesamte Website:</strong> Fügen Sie <code>.cb-card-h1 { --cb-card-accent: #005a9c; --cb-card-header-color: #fff; }</code> zur Datei <code>user.css</code> des Joomla-Templates hinzu. Ersetzen Sie <code>h1</code> durch die gewünschte H/V-Variante.</p><p><strong>Nur für einen Artikel:</strong> Umschließen Sie die Tags mit <code>&lt;div class=&quot;meine-cards&quot;&gt;…&lt;/div&gt;</code> und fügen Sie <code>&lt;style&gt;.meine-cards .cb-card-h1 { --cb-card-accent: #005a9c; }&lt;/style&gt;</code> in den Artikel ein, wenn Editor und Website-Richtlinie Style-Elemente erlauben.</p><p>Erweiterte Anpassungen: <code>--cb-card-header-bg</code>, <code>--cb-card-header-color</code>, <code>--cb-card-bg</code>, <code>--cb-card-color</code> und <code>--cb-card-border-color</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_TEXT="<p>Verwenden Sie <code>card=h1</code> bis <code>card=h6</code> oder <code>card=v1</code> bis <code>card=v6</code>. Bei allen Varianten steht der Titel horizontal über dem Inhalt. Der Kopf wird nur mit einem ausdrücklich angegebenen, nicht leeren <code>title=</code> angezeigt.</p><p>Card-Titel verwenden standardmäßig <code>h4</code>. Fügen Sie dem Titel <code>|h1</code> bis <code>|h6</code> hinzu, um eine Überschriftenebene zu wählen, oder <code>|remX</code> / <code>|remX.X</code>, um eine positive visuelle Größe festzulegen und dabei die semantische Ebene <code>h4</code> beizubehalten. Leerzeichen um das letzte <code>|</code> sind optional; bei Suffixen wird die Groß-/Kleinschreibung nicht berücksichtigt. Ein unbekanntes Suffix bleibt Bestandteil des vollständigen Titels, der mit der standardmäßigen <code>h4</code>-Darstellung ausgegeben wird.</p><p><code>{CBStats id=15 field=Gruppe output=pie title=&quot;Verteilung | h4&quot; card=h1}</code><br><code>{CBStats id=15 field=Gruppe output=pie title=&quot;Verteilung | rem1.25&quot; card=h1}</code></p><p>Überschreiben Sie Farben in der Joomla-Datei <code>user.css</code> mit den benutzerdefinierten Eigenschaften <code>--cb-card-*</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DIMENSIONS_LABEL="Responsive Diagrammabmessungen"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DIMENSIONS_TEXT="<p><code>width=</code> steuert die Breite des Diagrammcontainers, <code>height=</code> seine Höhe. Zulässig sind positive Ganzzahlen, <code>px</code> oder <code>%</code>. Eine Zahl ohne Einheit wird zu Pixeln. CSS-Ausdrücke, andere Einheiten und Werte über 100% oder 5000px werden abgelehnt.</p><p><strong>Ohne Optionen:</strong> Pie verwendet 80%, wird zentriert und ist auf 350px begrenzt. Bar, Histogramm, Linie und Radar verwenden 100%. Standardmäßig entsteht kein horizontaler Bildlauf.</p><p><strong>Ausdrückliche Werte:</strong> <code>width=100%</code> entfernt die 350px-Grenze von Pie. <code>height=280</code> bedeutet 280px und deaktiviert das feste Seitenverhältnis. Prozentuale Höhen benötigen ein Elternelement mit definierter Höhe.</p><p><strong>Beispiele:</strong><br><code>{CBStats id=15 field=Gruppe output=pie}</code><br><code>{CBStats id=15 field=Gruppe output=pie width=100%}</code><br><code>{CBStats id=15 field=Gruppe output=bar width=100% height=280}</code><br><code>{CBStats id=15 field=Gruppe output=radar width=80% height=320px}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_LABEL="Elemente des Diagrammergebnisses ausblenden"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_TEXT="<p><code>hide=</code> akzeptiert ausschließlich <code>total</code>, <code>values</code> und <code>graph</code>, die mit <code>|</code> in beliebiger Reihenfolge kombiniert werden. <code>total</code> blendet nur die angezeigte Gesamtsumme aus, <code>values</code> blendet die textuelle Beschriftungs- und Werteliste unter der Grafik aus, ohne die Grafik selbst zu ändern, und <code>graph</code> blendet die Zeichnung aus und behält diese leichte Textliste bei. Ohne <code>hide=</code> wird alles angezeigt. Werden alle drei Elemente ausgeblendet, erscheint statt eines leeren Blocks eine Meldung. Die frühere Syntax <code>total=hide</code> wird abgelehnt; verwenden Sie <code>hide=&quot;total&quot;</code>.</p><p><code>hide=&quot;total|values&quot;</code>: nur vollständige Grafik. <code>hide=&quot;graph|total&quot;</code>: nur Textliste. <code>hide=&quot;graph&quot;</code>: Textliste und Gesamtsumme. <code>hide=&quot;values&quot;</code>: vollständige Grafik und Gesamtsumme. <code>hide=&quot;graph|values&quot;</code>: nur Gesamtsumme.</p><p><code>{CBStats id=15 field=GroupeVcmb output=bar hide=&quot;values&quot;}</code><br><code>{CBStats id=15 field=age output=histogram groups=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;total|values&quot;}</code><br><code>{CBStats id=15 field=age output=radar groups=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;graph|total&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_TITLE="Manuelle Version zum Aufbewahren"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TITLE="Titel"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TITLES="Bezeichnungen"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_VALUES="Werte"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TOTAL="Gesamt"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SYNTAX_LABEL="Manuelle CBStats-Syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPY="📋 Syntax kopieren"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPIED="✓ Syntax kopiert"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPY_FAILED="Automatisches Kopieren nicht möglich. Wählen Sie die Syntax aus und verwenden Sie Strg+C."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_LABEL="Manueller Export"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_TEXT="<p>Nur <code>export=manual</code> zeigt die endgültigen Ergebnisse und die sichtbare <code>source=manual</code>-Syntax unter Kreis-, Balkendiagramm- und Tabellenausgaben. Endgültige Bezeichnungen nach <code>titles=</code>, Ergänzungen und Sortierung werden direkt in <code>values=</code> geschrieben; <code>titles=</code> wird nicht kopiert.</p><p><code>{CBStats id=15 field=Strecke output=pie title='👥 Gesamtzahl der Anmeldungen' export=manual}</code></p><p>Die zentrierte Schaltfläche <strong>Syntax kopieren</strong> kopiert exakt die darüber angezeigte Syntax. Bei einer bereits manuellen Quelle wird die normalisierte endgültige Syntax einmalig und ohne Verschachtelung angezeigt.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_SOURCE="source muss view oder manual sein."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_MANUAL_OUTPUT="Der manuelle Modus unterstützt nur pie, bar, histogram, line, radar, table und total."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUES_REQUIRED="CBStats: Es wurden keine gültigen manuellen Werte angegeben."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUE_INVALID="CBStats: Ungültiger manueller Wert „%s“."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_MANUAL_LABEL="Manueller Modus — Statistiken dauerhaft erhalten"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_MANUAL_TEXT="<p><code>source=manual</code> verwendet ausschließlich <code>values=</code>, ohne ContentBuilder-Ansicht, Feld oder Abfrage. Ergebnisse bleiben erhalten, wenn eine Ansicht wiederverwendet wird.</p><p><code>{CBStats source=manual output=pie values='100 km=45;150 km=47;200 km=38;200 km (Formel)=30' title='👥 Gesamtzahl der Anmeldungen'}</code></p><p>Ausgaben: <code>pie</code>, <code>bar</code>, <code>table</code>, <code>total</code>. <code>add=</code>, <code>titles=</code>, <code>title=</code>, <code>sort=none|title|label|value</code> und <code>dir=asc|desc</code> bleiben verfügbar. Doppelte Bezeichnungen werden addiert. Verwenden Sie in Bezeichnungen <code>\;</code>, <code>\=</code> und <code>\\</code>. Fügen Sie weder <code>id=</code> noch <code>field=</code> hinzu.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_VALUE="Wert"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TOTAL="Gesamt"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TOTAL_SEPARATOR=":"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_UNAVAILABLE="Statistiken nicht verfügbar"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_INVALID_REQUEST="Ungültige Statistikanfrage."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_VALIDATION_INTRO="CBStats kann nicht angezeigt werden. Korrektur erforderlich:"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_SYNTAX_HELP="Hilfe zur CBStats-Syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EMPTY_VALUE="leerer Wert"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_UNKNOWN_OPTION="Die CBStats-Option „%1$s“ ist unbekannt (empfangener Wert: „%2$s“)."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_INVALID_OPTION_VALUE="Die CBStats-Option „%1$s“ enthält den ungültigen Wert „%2$s“. %3$s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_SOURCE="Verwenden Sie source=view oder source=manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_ID="Verwenden Sie eine strikt positive Ansichts-ID, zum Beispiel id=15."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_NUMERIC_SYNTAX="Schreiben Sie numerische Optionen ohne Anführungszeichen, zum Beispiel id=15, limit=10 oder target=200."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_IDSUM="Verwenden Sie zwei bis fünf eindeutige positive Ansichts-IDs, mit + getrennt, zum Beispiel idsum=15+16."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_ID_CONFLICT="Verwenden Sie entweder id oder idsum, niemals beide."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_OUTPUT="Zulässige Ausgaben: total, table, pie, bar, histogram, line, radar, json, sum, min, max, avg, remaining, percentage, progress, distinct und view_name."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_TARGET="Geben Sie bei output=remaining oder output=progress eine positive Zahl ohne Anführungszeichen an, zum Beispiel target=200."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_PERCENTAGE_VALUE="Geben Sie bei output=percentage field= und eine nicht leere value=-Auswahl an."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_TARGET_OUTPUT="target kann nur mit output=remaining oder output=progress verwendet werden."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REMAINING_LABEL="Rest bis zu einem Ziel"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REMAINING_TEXT="<p><code>output=remaining target=200</code> zieht die normal gefilterte CBStats-Gesamtzahl vom positiven Zielwert ab und gibt nie einen Wert unter null aus.</p><p>Alle normalen Ansichts-, Quellen-, Berechtigungs- und Datensatzfilter werden zuerst angewendet. Beispiel: <code>{CBStats id=15 output=remaining target=200}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PERCENTAGE_LABEL="Prozentsatz eines ausgewählten Werts"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PERCENTAGE_TEXT="<p><code>output=percentage</code> gibt den Anteil der Datensätze zurück, die <code>field=</code> und <code>value=</code> entsprechen, innerhalb der durch den optionalen Filter <code>filter[field]</code>/<code>filter[value]</code> eingeschränkten Grundgesamtheit. Eine leere Auswahl wird abgelehnt und eine leere Grundgesamtheit ergibt 0&#8239;%.</p><p>Beispiel: <code>{CBStats id=15 field=Geschlecht value=&quot;M&quot; output=percentage}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PROGRESS_LABEL="Fortschritt zu einem Ziel"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PROGRESS_TEXT="<p><code>output=progress target=200</code> gibt die normal gefilterte Gesamtzahl als Prozentsatz eines positiven Ziels zurück, begrenzt auf 100&#8239;%.</p><p>Beispiel: <code>{CBStats id=15 output=progress target=200}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISTINCT_LABEL="Eindeutige Werte"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISTINCT_TEXT="<p><code>output=distinct</code> zählt die eindeutigen, nicht leeren Werte von <code>field=</code>, nachdem alle normalen CBStats-Filter, Ansichts-/Quellenbeschränkungen und Berechtigungen angewendet wurden.</p><p>Unterstützt werden <code>filter[field]</code>, <code>filter[value]</code>, die Kurzform <code>value=</code> für dasselbe Feld, <code>*</code>-Platzhalter und <code>|</code>-Alternativen. Beispiele: <code>{CBStats id=15 field=Department output=distinct}</code> und <code>{CBStats id=15 field=Department value=&quot;78|60&quot; output=distinct}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_MANUAL_OUTPUT="Mit source=manual verwenden Sie total, table, pie, bar, histogram, line oder radar."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_IDSUM_OUTPUT="output=view_name kann nicht mit idsum verwendet werden."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_FIELD="Geben Sie mit field= ein für Statistiken verfügbares Element der ausgewählten Ansicht an."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_FILTER="Geben Sie filter[field] und filter[value] gemeinsam an oder verwenden Sie value= als Kurzform für dasselbe Feld."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_SORT="Verwenden Sie sort=none, sort=title oder sort=value."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_MANUAL_SORT="Mit source=manual verwenden Sie sort=none, sort=title, sort=label oder sort=value."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_DIR="Verwenden Sie dir=asc oder dir=desc."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_LIMIT="Verwenden Sie eine strikt positive Ganzzahl, zum Beispiel limit=10."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_HIDE="Verwenden Sie total, values oder graph, mit | getrennt. Blenden Sie nicht alle verfügbaren Ergebniselemente aus."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_EXPORT="Der einzige zulässige Wert ist export=manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_BACKGROUND="Verwenden Sie transparent, eine gültige Hexadezimal-/rgb-/rgba-Farbe oder einen unterstützten sicheren Farbnamen."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_ADD="Verwenden Sie mit Semikolons getrennte Einträge Bezeichnung=VorzeichenGanzzahl."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_TITLES="Verwenden Sie mit Semikolons getrennte Einträge Original=Anzeigetitel, ohne leere Seite."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_HEADERS="Verwenden Sie mit Semikolons getrennte Einträge Überschrift=Anzeigebezeichnung."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_GROUPS="Verwenden Sie mit Semikolons getrennte Gruppen der Form Minimum-Maximum, Maximum-, Minimum+ oder Wert,Wert=Bezeichnung."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_VALUES="Mit source=manual geben Sie values als Bezeichnung=Zahl-Einträge an, die mit Semikolons getrennt sind."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_MESSAGE="CBStats DEBUG: %s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_ID_REQUIRED="Der Parameter id ist erforderlich."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_ID_AND_IDSUM="id und idsum können nicht gemeinsam verwendet werden."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_IDSUM_TOO_FEW="idsum erfordert mindestens zwei Ansichtskennungen."
