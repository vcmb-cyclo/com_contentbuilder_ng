PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_ITEMS="ViewID=%1$s; %2$s Elemente=%3$s."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_NO_DATA="Keine Daten verfügbar"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_PIE_ARIA_LABEL="Kreisdiagramm: %s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_BAR_ARIA_LABEL="Horizontales Balkendiagramm: %s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_CHART_ARIA_LABEL="%1$s-Diagramm: %2$s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_CHART_UNAVAILABLE="Diagramm nicht verfügbar. Die detaillierten Daten sind unten aufgeführt."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_RADAR_TOO_FEW="Ein Radardiagramm benötigt mindestens 3 Werte."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_RADAR_TOO_MANY="Ein Radardiagramm akzeptiert höchstens %s Werte. Verwenden Sie limit oder weniger Gruppen."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_LABEL="CBStats: Zweck, Syntax und Ausgaben"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REFERENCE_LABEL="Vollständige Referenz und Verarbeitungsreihenfolge"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REFERENCE_TEXT="<p><strong>Quelle:</strong> <code>source</code>, <code>id</code>, <code>idsum</code>, <code>values</code>. <strong>Daten:</strong> <code>field</code>, <code>filter[field]</code>, <code>filter[value]</code>, <code>value</code>. <strong>Berechnung:</strong> <code>target</code>, <code>add</code>, <code>titles</code>, <code>titleset</code>, <code>groups</code>, <code>groupset</code>, <code>sort</code>, <code>dir</code>, <code>limit</code>. <strong>Ausgabe:</strong> <code>output</code>, <code>headers</code>, <code>title</code>, <code>background</code>, <code>hide</code>, <code>card</code>, <code>w</code>, <code>width</code>, <code>height</code>, <code>export</code>. <strong>Diagnose:</strong> <code>debug</code>. Das frühere <code>total=hide</code> wird abgelehnt; verwenden Sie <code>hide=&quot;total&quot;</code>.</p><p>Reihenfolge: ACL → Filter → Gruppierung der Quellwerte → bei Bedarf <code>groups</code> → <code>add</code> → Nullnormalisierung → <code>titles</code> → Sortierung → <code>limit</code> → Ausgabe und Darstellung.</p><p><strong>Vollständiges Beispiel:</strong><br><code>{CBStats id=15 field=Gruppe filter[field]=Status filter[value]=&quot;Veröffentlicht*&quot; add=&quot;Extern=2&quot; titles=&quot;Extern=Gäste&quot; sort=value dir=desc limit=10 output=bar title=&quot;Verteilung&quot; hide=&quot;values&quot; card=h1 width=100% height=320 export=manual}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ADD_LABEL="Filter, Sortierung und externe Werte"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ADD_TEXT="<p><strong>Filter auf einem anderen Feld:</strong> <code>field=Element-1</code> bezeichnet das gruppierte und angezeigte Feld, während <code>filter[field]=Element-2</code> ausschließlich Datensätze auswählt. Geben Sie <code>filter[field]</code> und <code>filter[value]</code> gemeinsam an: <code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]='Dét* | 3 | 4' output=bar}</code>. <code>*</code> ist ein Platzhalter, <code>|</code> trennt Alternativen und umgebende Leerzeichen werden entfernt. Ohne Platzhalter erfolgt ein exakter Vergleich.</p><p><strong>Kurzform für dasselbe Feld:</strong> <code>{CBStats id=15 field=Element-2 value='Dét* | 3 | 4' output=bar}</code> entspricht exakt dem vollständigen Filter auf <code>Element-2</code>. Verwenden Sie <code>value=</code> nur, wenn der Filter auf <code>field=</code> angewendet wird; bei unterschiedlichen Feldern sind <code>filter[field]</code> und <code>filter[value]</code> erforderlich. Verwechseln Sie <code>value=</code> nicht mit <code>values=</code>, das ausschließlich für <code>source=manual</code> bestimmt ist.</p><p><strong>Vorzeichenbehaftete externe Deltas mit add=:</strong> Eine positive Ganzzahl fügt Vorkommen hinzu, null ändert nichts und eine negative Ganzzahl entfernt Vorkommen, zum Beispiel <code>add='100 km=5;150 km=-2'</code>. Ist das endgültige berechnete Ergebnis negativ, verwendet CBStats vor titles, Sortierung, Prozentberechnung und Ausgabe vorübergehend <code>0</code>, ohne die Quelldaten zu ändern. Ein späteres Ergebnis von null oder größer wird normal verwendet. Wiederholte Bezeichnungen werden kumuliert.</p><p><strong>Anzeigebezeichnungen mit titles=:</strong> <code>titles='Original=Anzeigetitel;Weiteres=Weiterer Titel'</code> benennt ausschließlich die Anzeige um. <code>add</code> verwendet zuerst die ursprünglichen Bezeichnungen. Nicht zugeordnete Bezeichnungen bleiben unverändert; identische Anzeigetitel führen Kategorien nicht zusammen. Semikolons trennen Zuordnungen, das erste Gleichheitszeichen trennt Original und Anzeigetitel.</p><p><strong>Sortierung:</strong> <code>sort=none|title|value</code> und <code>dir=asc|desc</code> gelten für Tabelle, JSON, Kreis- und Balkendiagramm. <code>sort=title</code> verwendet die endgültigen Anzeigetitel. Logische Reihenfolge: Daten → Filter → Gruppierung → add → Normalisierung → titles → Sortierung → Ausgabe.</p><p><strong>Beispiele:</strong><br><code>{CBStats id=15 field=Strecke output=pie add='100 km=-3'}</code><br><code>{CBStats id=15 field=Strecke output=table titles='1=Gruppe 1;2=Gruppe 2'}</code><br><code>{CBStats id=15 field=Strecke output=bar add='1=-2;2=3' titles='1=Gruppe 1;2=Gruppe 2' sort=value dir=desc}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DEBUG_LABEL="URL/API, API + Rechte und DEBUG"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PRESENTATION_LABEL="Gesamtbezeichnung und Hintergrund"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HEADERS_LABEL="Spaltenüberschriften der Tabelle"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HEADERS_TEXT="<p><code>headers='Strecke=Distanz;Total=Teilnehmer'</code> passt nur die zwei Spaltenüberschriften von <code>output=table</code> an. Nicht zugeordnete Überschriften bleiben unverändert; unbekannte Schlüssel und leere Bezeichnungen werden ignoriert. Die Legenden von Kreis- und Balkendiagrammen bleiben unverändert. <code>title=</code>, <code>titles=</code> und <code>headers=</code> sind unabhängig. <code>export=manual</code> behält die Zuordnung bei.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PRESENTATION_TEXT="<p><code>title='👥 Gesamtzahl der Anmeldungen'</code> passt die globale Gesamtbezeichnung für Tabelle, Kreis- und Balkendiagramm an.</p><p><code>titles='Original=Anzeigetitel'</code> passt die Bezeichnungen einzelner Kategorien an.</p><p>CBStats ergänzt das Trennzeichen der aktiven Sprache, wenn es fehlt, und verdoppelt einen vorhandenen Doppelpunkt nicht.</p><p><code>background=</code> akzeptiert <code>transparent</code>, Hexadezimalfarben, <code>rgb()</code>, <code>rgba()</code> und die dokumentierten sicheren Farbnamen.</p><p><code>{CBStats id=15 field=Strecke output=pie title='👥 Gesamtzahl der Anmeldungen'}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DEBUG_TEXT="<p><strong>URL/API:</strong> Alle Datenausgaben können mit <code>action=cbstats</code> getestet werden: <code>json</code>, <code>table</code>, <code>pie</code>, <code>bar</code>, <code>histogram</code>, <code>line</code>, <code>radar</code>, <code>total</code>, <code>sum</code>, <code>min</code>, <code>max</code>, <code>avg</code> und <code>view_name</code>. Listen- und Diagrammnamen geben normalisierte Daten ohne HTML zurück. <code>groups</code>, <code>add</code>, <code>titles</code>, <code>sort</code>, <code>dir</code> und <code>limit</code> verwenden die Validierung der Artikel-Tags.</p><p><strong>API + Rechte:</strong> Prüfen Sie ACLs, veröffentlichte und für API/Stats freigegebene Felder, die STATS-Berechtigung sowie den <strong>API</strong>-Tab der Ansicht. Keine Anfrage umgeht Ansichts- oder Feldberechtigungen.</p><p><strong>DEBUG:</strong> Sichere Diagnosen folgen der DEBUG-Einstellung der Ansicht. DEBUG gewährt kein zusätzliches Recht und umgeht niemals ACLs.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_TEXT="<p>CBStats zeigt dynamische Statistiken aus ContentBuilder-NG-Ansichten direkt in Joomla-Artikeln an und behält dabei die Zugriffsrechte und die Konfiguration der Ansichten bei.</p><p><strong>Einfaches Beispiel:</strong> <code>{CBStats id=15 output=total}</code>. Alle Syntaxoptionen finden Sie in den nachfolgenden Abschnitten.</p><p><strong>Syntax:</strong> <code>{CBStats id=15 ...}</code>. Die Standardausgabe ist <code>total</code>.</p><p><strong>Verfügbare Ausgaben:</strong></p><ul><li><code>total</code>: Anzahl übereinstimmender Datensätze.</li><li><code>table</code>: HTML-Tabelle mit Wert-/Anzahlpaaren.</li><li><code>pie</code>: responsives Kreisdiagramm mit dynamischen Farben, lokalisierten Prozentwerten, Tooltip, detaillierter Legende und Gesamtsumme.</li><li><code>bar</code>: responsives horizontales Balkendiagramm mit Werten, Prozenten, Tooltip, Legende, Gesamtsumme und Sortierung.</li><li><code>histogram</code>: Verteilung in expliziten Wertgruppen mit <code>groups</code>, zum Beispiel <code>groups='18-29;30-39;40-49;50+'</code>.</li><li><code>line</code>: sortiertes Trenddiagramm, häufig mit Datums- oder Sequenzkategorien, zum Beispiel <code>output=line limit=12</code>.</li><li><code>radar</code>: Vergleichsdiagramm mit mehreren Achsen; verwenden Sie 3–8 Kategorien, zum Beispiel <code>field=Distanz output=radar groups='0-100;101-200;201+'</code>.</li><li><code>json</code>: rohes <code>[{label,value}]</code>-Array.</li><li><code>sum</code>, <code>min</code>, <code>max</code>: numerische Aggregate; ISO-Daten unterstützen chronologisches Min/Max.</li><li><code>avg</code>: arithmetischer Mittelwert numerischer Werte (leere/nicht numerische Werte werden ignoriert).</li><li><code>remaining</code>: noch benötigte Datensätze bis zu einem positiven <code>target</code>.</li><li><code>percentage</code>: Anteil der Datensätze, die <code>field</code> und <code>value</code> entsprechen.</li><li><code>progress</code>: gefilterte Gesamtsumme als Prozentsatz von <code>target</code>, auf 100 % begrenzt.</li><li><code>distinct</code>: Anzahl eindeutiger, nicht leerer Feldwerte.</li><li><code>view_name</code>: Name der ContentBuilder-NG-Ansicht.</li></ul><p>Tabelle, JSON, Kreis-, Balken-, Histogramm-, Linien- und Radardiagramm verwenden dieselbe normalisierte PHP-Engine; <code>avg</code> nutzt dieselben normalisierten numerischen Werte.</p><p><strong>Einfache Beispiele:</strong><br><code>{CBStats id=15 output=total}</code><br><code>{CBStats id=15 field=Strecke output=table}</code><br><code>{CBStats id=15 field=Strecke output=json}</code><br><code>{CBStats id=15 field=Strecke output=pie}</code><br><code>{CBStats id=15 field=Strecke output=bar sort=value dir=desc}</code><br><code>{CBStats id=15 field=Distanz output=avg}</code><br><code>{CBStats id=15 field=Distanz output=histogram groups='0-50;51-100;101+'}</code><br><code>{CBStats id=15 field=Datum output=line limit=12}</code><br><code>{CBStats id=15 field=Punktzahl output=radar}</code></p><p><strong>Ansichten mit idsum zusammenführen:</strong> <code>idsum=15+16</code> ersetzt <code>id=</code> und akzeptiert zwei bis fünf eindeutige, durch <code>+</code> getrennte Ansichtskennungen. Jede Ansicht wendet Berechtigungen und Filter an, bevor Werte mit exakt gleicher Bezeichnung addiert werden. Danach werden <code>add=</code>, Nullnormalisierung, <code>titles=</code>, Sortierung und Ausgabe einmalig auf das zusammengeführte Ergebnis angewendet. <code>output=view_name</code> ist mit <code>idsum</code> nicht verfügbar. Beispiele: <code>{CBStats idsum=15+16 field=&quot;Strecke&quot; output=&quot;table&quot; title=&quot;Monticyclo / Montigravel&quot;}</code> und <code>{CBStats idsum=15+16+17+18+19 field=&quot;Distanz&quot; output=&quot;bar&quot; title=&quot;BRM&quot;}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_FILTERS_TEXT="<p><strong>Nach einem anderen Feld filtern:</strong> <code>field=Element-1</code> ist das im Diagramm gruppierte und angezeigte Feld. <code>filter[field]=Element-2</code> ist das zum Filtern der Datensätze verwendete Feld. <code>filter[value]=&quot;Dét* | 3 | 4&quot;</code> behält Werte, die mit <code>Dét</code> beginnen, oder den exakten Wert <code>3</code> oder den exakten Wert <code>4</code>. Das Zeichen <code>|</code> trennt Alternativen, umgebende Leerzeichen werden ignoriert und ohne <code>*</code> erfolgt ein exakter Vergleich.</p><p><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code></p><p><strong>Kurzform für dasselbe Feld:</strong> Wenn der Filter auf das angezeigte Feld angewendet wird, entspricht <code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code> dem vollständigen Filter <code>{CBStats id=15 field=Element-2 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code>. Bei unterschiedlichen Feldern sind <code>filter[field]</code> und <code>filter[value]</code> zu verwenden. <code>value=</code> darf nicht mit <code>values=</code> verwechselt werden, das ausschließlich für <code>source=manual</code> bestimmt ist.</p><p><strong>Beispiele:</strong><br><code>{CBStats id=15 field=Strecke output=pie add='100 km=-3'}</code><br><code>{CBStats id=15 field=Strecke output=table titles='1=Gruppe 1;2=Gruppe 2'}</code><br><code>{CBStats id=15 field=Strecke output=bar add='1=-2;2=3' titles='1=Gruppe 1;2=Gruppe 2' sort=value dir=desc}</code><br><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code><br><code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_LIMIT="limit muss eine strikt positive Ganzzahl sein."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_TOTAL="total akzeptiert ausschließlich den Wert hide."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISPLAY_OPTIONS_LABEL="Ergebnisbegrenzung und Summenanzeige"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISPLAY_OPTIONS_TEXT="<p><code>limit=10</code> behält die ersten 10 Statistikwerte nach <code>sort=</code> und <code>dir=</code>. Ohne <code>limit</code> werden alle Werte ausgegeben. Numerische Optionen müssen strikt positive Ganzzahlen sein und ohne Anführungszeichen geschrieben werden.</p><p>Nach der Begrenzung werden die angezeigte Gesamtsumme und die Diagrammprozentsätze ausschließlich aus den beibehaltenen Werten neu berechnet. Eine Kategorie Sonstige wird nicht hinzugefügt.</p><p><code>{CBStats id=15 field=Ort output=table sort=value dir=desc limit=10}</code><br><code>{CBStats idsum=15+16 field=Verein output=bar sort=value dir=desc limit=15}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_INVALID_NAME="CBStats-Datensatzwarnung: Der Dateiname %s ist ungültig."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_NOT_FOUND="CBStats-Datensatzwarnung: %s wurde nicht gefunden. Die ursprünglichen Werte werden verwendet."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_UNREADABLE="CBStats-Datensatzwarnung: %s ist nicht lesbar. Die ursprünglichen Werte werden verwendet."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_EMPTY="CBStats-Datensatzwarnung: %s ist leer. Die ursprünglichen Werte werden verwendet."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_INVALID_SYNTAX="CBStats-Datensatzwarnung: %s enthält eine ungültige INI-Syntax. Die ursprünglichen Werte werden verwendet."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_MISSING_TITLES="CBStats-Datensatzwarnung: %s enthält keinen verwendbaren Abschnitt [titles]. Die ursprünglichen Werte werden verwendet."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_INVALID_ENTRIES="CBStats-Datensatzwarnung: %s enthält ungültige Zuordnungen, die ignoriert wurden."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_TITLESET_LABEL="Wiederverwendbare Titelsätze"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_TITLESET_TEXT="<p><code>titleset=&quot;departements-fr-FR.ini&quot;</code> lädt wiederverwendbare Kategoriebezeichnungen aus einer verwalteten INI-Datei. Website-Dateien unter <code>media/contentbuilderng/cbstats/titlesets</code> überschreiben gleichnamige mitgelieferte Dateien unter <code>media/com_contentbuilderng/cbstats/titlesets</code>. Inline-Zuordnungen mit <code>titles=</code> haben Vorrang.</p><p>Fehlende oder ungültige Dateien blockieren die Ausgabe nie: Die ursprünglichen Werte bleiben sichtbar. Wenn Joomla-Debug aktiviert ist, protokolliert CBStats eine Warnung. Verwalten Sie Dateien unter ContentBuilder NG → Über → CBStats-Titelsätze.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_GROUPSET_LABEL="groupset — Wiederverwendbare Wertgruppen"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_GROUPSET_TEXT="<p><code>groups=</code> definiert Wertgruppen direkt. Verwenden Sie inklusive numerische Intervalle wie <code>18-24</code>, <code>18-</code> und <code>70+</code> oder explizite, nicht zusammenhängende Werte mit einer Anzeigebezeichnung wie <code>1,2,7,9=Gruppe 1</code>. Werte, die keiner Gruppe entsprechen, bleiben einzelne Kategorien.</p><p><code>groupset=&quot;ages-fr-FR.ini&quot;</code> lädt wiederverwendbare Wertgruppen aus einer verwalteten INI-Datei mit einem Abschnitt <code>[groups]</code>. Jeder Schlüssel ist ein Intervall oder eine kommagetrennte Werteliste; sein INI-Wert ist die Anzeigebezeichnung.</p><p><strong>Vollständige Beispiele:</strong><br><code>{CBStats id=15 field=Kategorie output=bar groups=&quot;1,2,7,9=Gruppe 1;3,4,8=Gruppe 2&quot;}</code><br><code>{CBStats id=15 field=Alter output=histogram groupset=&quot;ages-fr-FR.ini&quot;}</code></p><p>Verwalten Sie diese Dateien unter ContentBuilder NG → Über → CBStats-Datensätze mit dem Typ Gruppen. Inline-<code>groups=</code> hat Vorrang vor <code>groupset=</code>; Inline-<code>titles=</code> überschreibt Gruppenbezeichnungen.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_MISSING_DATA="Der CBStats-Datensatz %s enthält keinen gültigen Abschnitt [titles] oder [groups]."
