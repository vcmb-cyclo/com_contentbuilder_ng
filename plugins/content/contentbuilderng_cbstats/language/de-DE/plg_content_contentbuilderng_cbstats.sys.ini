PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_XML_DESCRIPTION="Fügt Statistiken aus ContentBuilder-NG-Ansichten in Joomla-Inhalte ein und kann mit idsum zwei bis fünf Ansichten zusammenführen. title passt die globale Gesamtbezeichnung und titles die Kategoriebezeichnungen an. limit begrenzt die endgültigen Werte und total=hide blendet die angezeigte Gesamtsumme aus."
