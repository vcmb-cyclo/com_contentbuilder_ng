PLG_CONTENT_CONTENTBUILDERNG_CBSTATS="ContentBuilder NG - Content - CBStats"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_XML_DESCRIPTION="CBStats zeigt dynamische Statistiken aus ContentBuilder-NG-Ansichten direkt in Joomla-Artikeln an und behält dabei die Zugriffsrechte und die Konfiguration der Ansichten bei. Einfaches Beispiel: {CBStats id=AnsichtsID output=total}. Alle Syntaxoptionen finden Sie in der nachfolgenden Beschreibung."
