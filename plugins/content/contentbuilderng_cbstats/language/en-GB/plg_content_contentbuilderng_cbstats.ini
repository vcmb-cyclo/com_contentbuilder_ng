PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_XML_DESCRIPTION="CBStats displays dynamic statistics from ContentBuilder NG views directly inside Joomla articles while preserving view access rights and configuration. Simple example: {CBStats id=ViewID output=total}. See the description below for all syntax options."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_CARD="Use card=h1 to card=h6 or card=v1 to card=v6."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_W="Use w=33, w=66 or w=100 without quotation marks."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_W_CARD="The w option requires a valid card option."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_WIDTH_LABEL="Card widths"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_WIDTH_TEXT="<p>Inside <code>cb-cards</code>, <code>w=33</code> spans one column, <code>w=66</code> two columns and <code>w=100</code> the complete row. Write the value without quotation marks and use it only with <code>card=</code>. Without <code>w=</code>, V uses 33 and H uses 100. All Cards become full-width on small screens. A Card moves to the next row when insufficient space remains.</p><p><code>w=</code> controls the Card; <code>width=</code> controls the chart inside it.</p><p><strong>Example:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Group output=pie title=&quot;Groups&quot; card=v1 w=33}<br>{CBStats id=15 field=FirstName output=bar title=&quot;First names&quot; card=v2 w=66 width=100%}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_WIDTH="Use a number optionally followed by px or %, for example width=350, width=350px or width=80%."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_HEIGHT="Use a number optionally followed by px or %, for example height=280, height=280px or height=80%."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_LABEL="Optional shared ContentBuilder NG Card"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_CUSTOMIZE_LABEL="Customising Cards"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_GRID_LABEL="Placing V Cards side by side"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ARTICLE_EXAMPLE_LABEL="Complete two-row article example"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ARTICLE_EXAMPLE_TEXT="<p>Put up to six V Cards in one <code>cb-cards</code> container. The first three form the first row and the next cards the second. Do not insert <code>&lt;br&gt;</code> or close the container between rows. A standalone H Card can follow the container directly.</p><p><strong>Joomla HTML example, without Markdown ``` markers:</strong></p><p><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Group output=pie title=&quot;Groups&quot; card=v1}<br>{CBStats id=15 field=FirstName output=bar title=&quot;First names&quot; card=v2}<br>{CBStats id=15 field=Group output=table title=&quot;Details&quot; card=v3}<br>{CBStats id=15 field=Town output=pie title=&quot;Towns&quot; card=v4}<br>{CBStats id=15 field=Age output=histogram ranges=&quot;18-29;30-39;40-49;50+&quot; title=&quot;Ages&quot; card=v5}<br>{CBStats id=15 output=total title=&quot;Total&quot; card=v1}<br>&lt;/div&gt;<br>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; title=&quot;Latest records&quot; sort=ID dir=desc limit=10 card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_GRID_TEXT="<p>Put all three tags in one <code>&lt;div class=&quot;cb-cards&quot;&gt;</code>, with no <code>&lt;br&gt;</code> and without closing the container between tags. On desktop V Cards use three columns; on small screens one. An H Card spans the full row.</p><p><strong>Example:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Group output=pie title=&quot;Groups&quot; card=v1}<br>{CBStats id=15 field=FirstName output=bar title=&quot;First names&quot; card=v2}<br>{CBStats id=15 field=Group output=table title=&quot;Details&quot; card=v3}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_CUSTOMIZE_TEXT="<p><strong>For the whole site:</strong> add <code>.cb-card-h1 { --cb-card-accent: #005a9c; --cb-card-header-color: #fff; }</code> to the Joomla template’s <code>user.css</code>. Replace <code>h1</code> with the required H/V variant.</p><p><strong>For one article only:</strong> wrap the tags in <code>&lt;div class=&quot;my-cards&quot;&gt;…&lt;/div&gt;</code>, then add <code>&lt;style&gt;.my-cards .cb-card-h1 { --cb-card-accent: #005a9c; }&lt;/style&gt;</code> in the article when its editor and site policy allow style elements.</p><p>Advanced overrides: <code>--cb-card-header-bg</code>, <code>--cb-card-header-color</code>, <code>--cb-card-bg</code>, <code>--cb-card-color</code> and <code>--cb-card-border-color</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_TEXT="<p>Use <code>card=h1</code> to <code>card=h6</code> or <code>card=v1</code> to <code>card=v6</code>. For every variant, the title is horizontal and above the content. A header is displayed only with an explicit non-empty <code>title=</code>.</p><p><code>{CBStats id=15 field=Group output=pie title=&quot;Distribution&quot; card=h1}</code></p><p>Override colours in Joomla <code>user.css</code> using the <code>--cb-card-*</code> custom properties.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DIMENSIONS_LABEL="Responsive chart dimensions"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DIMENSIONS_TEXT="<p><code>width=</code> controls the chart container width and <code>height=</code> its height. Accepted values are a positive integer, <code>px</code> or <code>%</code>. A bare number becomes pixels: <code>width=350</code> equals <code>width=350px</code>. CSS expressions, other units and values above 100% or 5000px are rejected.</p><p><strong>Without options:</strong> Pie uses 80% of its container, is centred and is capped at 350px. Bar, Histogram, Line and Radar use 100% of the available width. No chart should create horizontal scrolling by default.</p><p><strong>Explicit width:</strong> <code>width=100%</code> lets Pie fill the Card and removes its 350px maximum. <code>width=300</code> fixes 300px. Prefer percentages inside small containers.</p><p><strong>Explicit height:</strong> this disables the chart’s maintained aspect ratio. <code>height=280</code> means 280px. <code>height=80%</code> is useful only when the parent already has a defined CSS height; otherwise use pixels.</p><p><strong>Examples:</strong><br><code>{CBStats id=15 field=Group output=pie}</code><br><code>{CBStats id=15 field=Group output=pie width=100%}</code><br><code>{CBStats id=15 field=Group output=bar width=100% height=280}</code><br><code>{CBStats id=15 field=Group output=radar width=80% height=320px}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_LABEL="Hide chart result elements"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_TEXT="<p><code>hide=</code> accepts only <code>total</code>, <code>values</code> and <code>graph</code>, combined with <code>|</code> in any order. <code>total</code> hides only the displayed total, <code>values</code> hides the textual labels and values list below the graph without changing the graph itself, and <code>graph</code> hides the drawing while retaining that lightweight textual list. Without <code>hide=</code>, everything is displayed. Hiding all three elements produces a message instead of an empty block. The former <code>total=hide</code> syntax is rejected; use <code>hide=&quot;total&quot;</code>.</p><p><code>hide=&quot;total|values&quot;</code>: complete graph only. <code>hide=&quot;graph|total&quot;</code>: textual list only. <code>hide=&quot;graph&quot;</code>: textual list and total. <code>hide=&quot;values&quot;</code>: complete graph and total. <code>hide=&quot;graph|values&quot;</code>: total only.</p><p><code>{CBStats id=15 field=GroupeVcmb output=bar hide=&quot;values&quot;}</code><br><code>{CBStats id=25 field=age output=histogram ranges=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;total|values&quot;}</code><br><code>{CBStats id=25 field=age output=radar ranges=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;graph|total&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_TITLE="Manual version to keep"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TITLE="Title"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TITLES="Titles"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_VALUES="Values"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TOTAL="Total"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SYNTAX_LABEL="Manual CBStats syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPY="📋 Copy syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPIED="✓ Syntax copied"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPY_FAILED="Automatic copy failed. Select the syntax and use Ctrl+C."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_LABEL="Manual export"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_TEXT="<p>Only <code>export=manual</code> displays the final results and visible <code>source=manual</code> syntax below Pie, Bar and Table outputs. Final labels after <code>titles=</code>, additions and sorting are written directly into <code>values=</code>; <code>titles=</code> is not copied.</p><p><code>{CBStats id=25 field=Route output=pie title='👥 Total registrations' export=manual}</code></p><p>The centered <strong>Copy syntax</strong> button copies exactly the syntax shown above it. On an already manual source, the normalized final syntax is displayed once without nesting.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_SOURCE="source must be view or manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_MANUAL_OUTPUT="Manual mode supports only pie, bar, histogram, line, radar, table and total outputs."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUES_REQUIRED="CBStats: no valid manual values were provided."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUE_INVALID="CBStats: invalid manual value “%s”."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_MANUAL_LABEL="Manual mode — preserve statistics"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_MANUAL_TEXT="<p><code>source=manual</code> uses only <code>values=</code>, without a ContentBuilder view, field or query. It preserves results when a view is reused.</p><p><code>{CBStats source=manual output=pie values='100 km=45;150 km=47;200 km=38;200 km (Formula)=30' title='👥 Total registrations'}</code></p><p>Outputs: <code>pie</code>, <code>bar</code>, <code>table</code>, <code>total</code>. <code>add=</code>, <code>titles=</code>, <code>title=</code>, <code>sort=none|title|label|value</code> and <code>dir=asc|desc</code> remain available. Duplicate labels are added. In labels, use <code>\;</code>, <code>\=</code> and <code>\\</code>. Do not add <code>id=</code> or <code>field=</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_VALUE="Value"
