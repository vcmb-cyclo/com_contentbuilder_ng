PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_XML_DESCRIPTION="CBStats displays dynamic statistics from ContentBuilder NG views directly inside Joomla articles while preserving view access rights and configuration. Simple example: {CBStats id=15 output=total}. See the description below for all syntax options."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_CARD="Use card=h1 to card=h6 or card=v1 to card=v6."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_W="Use w=33, w=66 or w=100 without quotation marks."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_W_CARD="The w option requires a valid card option."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_WIDTH_LABEL="Card widths"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_WIDTH_TEXT="<p>Inside <code>cb-cards</code>, <code>w=33</code> spans one column, <code>w=66</code> two columns and <code>w=100</code> the complete row. Write the value without quotation marks and use it only with <code>card=</code>. Without <code>w=</code>, V uses 33 and H uses 100. All Cards become full-width on small screens. A Card moves to the next row when insufficient space remains.</p><p><code>w=</code> controls the Card; <code>width=</code> controls the chart inside it.</p><p><strong>Example:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Group output=pie labels=&quot;title=Groups&quot; card=v1 w=33}<br>{CBStats id=15 field=FirstName output=bar labels=&quot;title=First names&quot; card=v2 w=66 width=100%}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_WIDTH="Use a number optionally followed by px or %, for example width=350, width=350px or width=80%."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_HEIGHT="Use a number optionally followed by px or %, for example height=280, height=280px or height=80%."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_LABEL="Optional shared ContentBuilder NG Card"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EDITORIAL_CARD_LABEL="Editorial Card for free content"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EDITORIAL_CARD_TEXT="<p>An editorial Card groups free HTML, CBStats and CBList tags without requiring the full Card markup. Use the complete recommended syntax: <code>&lt;div class=&quot;cb-card-editorial&quot; data-card=&quot;v1&quot; data-w=&quot;33&quot;&gt;…&lt;/div&gt;</code>.</p><p>A direct <code>&lt;h1&gt;</code> to <code>&lt;h6 data-cb-card-title&gt;</code> becomes the coloured Card header and remains visible in the visual editor. An Hx heading without this attribute stays in the body. The legacy <code>data-title</code> syntax remains supported with its shared <code>|h1</code> to <code>|h6</code> and positive <code>|remX</code> suffixes. Without either title form, no header is rendered. <code>data-card</code> accepts <code>h1</code>–<code>h6</code> and <code>v1</code>–<code>v6</code>; its default is <code>v1</code>. <code>data-w</code> accepts <code>33</code>, <code>66</code> or <code>100</code>; its default is <code>33</code>. Invalid Card or width values use these safe defaults.</p><p><strong>Example:</strong><br><code>&lt;div class=&quot;cb-card-editorial&quot; data-card=&quot;v1&quot; data-w=&quot;33&quot;&gt;<br>&lt;h4 data-cb-card-title&gt;Information&lt;/h4&gt;<br>&lt;p&gt;Total: {CBStats id=15 output=total}&lt;/p&gt;<br>&lt;p&gt;Distinct groups: {CBStats id=15 field=Group output=distinct}&lt;/p&gt;<br>{CBList id=15 fields=&quot;Nom|Prenom&quot; limit=5}<br>&lt;/div&gt;</code></p><p>The standard HTML markup is preserved by TinyMCE and JCE. The renderer reuses the existing shared Card CSS and removes empty whitespace or non-breaking-space text nodes inserted between Cards in a <code>cb-cards</code> grid.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_CUSTOMIZE_LABEL="Customising Cards"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_GRID_LABEL="Placing V Cards side by side"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ARTICLE_EXAMPLE_LABEL="Complete two-row article example"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ARTICLE_EXAMPLE_TEXT="<p>Put up to six V Cards in one <code>cb-cards</code> container. The first three form the first row and the next cards the second. Do not insert <code>&lt;br&gt;</code> or close the container between rows. A standalone H Card can follow the container directly.</p><p><strong>Joomla HTML example, without Markdown ``` markers:</strong></p><p><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Group output=pie labels=&quot;title=Groups&quot; card=v1}<br>{CBStats id=15 field=FirstName output=bar labels=&quot;title=First names&quot; card=v2}<br>{CBStats id=15 field=Group output=table labels=&quot;title=Details&quot; card=v3}<br>{CBStats id=15 field=Town output=pie labels=&quot;title=Towns&quot; card=v4}<br>{CBStats id=15 field=Age output=histogram groups=&quot;18-29;30-39;40-49;50+&quot; labels=&quot;title=Ages&quot; card=v5}<br>{CBStats id=15 output=total labels=&quot;title=Total&quot; card=v1}<br>&lt;/div&gt;<br>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; title=&quot;Latest records&quot; sort=ID dir=desc limit=10 card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_GRID_TEXT="<p>Put all three tags in one <code>&lt;div class=&quot;cb-cards&quot;&gt;</code>, with no <code>&lt;br&gt;</code> and without closing the container between tags. On desktop V Cards use three columns; on small screens one. An H Card spans the full row.</p><p><strong>Example:</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Group output=pie labels=&quot;title=Groups&quot; card=v1}<br>{CBStats id=15 field=FirstName output=bar labels=&quot;title=First names&quot; card=v2}<br>{CBStats id=15 field=Group output=table labels=&quot;title=Details&quot; card=v3}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_CUSTOMIZE_TEXT="<p><strong>For the whole site:</strong> add <code>.cb-card-h1 { --cb-card-accent: #005a9c; --cb-card-header-color: #fff; }</code> to the Joomla template’s <code>user.css</code>. Replace <code>h1</code> with the required H/V variant.</p><p><strong>For one article only:</strong> wrap the tags in <code>&lt;div class=&quot;my-cards&quot;&gt;…&lt;/div&gt;</code>, then add <code>&lt;style&gt;.my-cards .cb-card-h1 { --cb-card-accent: #005a9c; }&lt;/style&gt;</code> in the article when its editor and site policy allow style elements.</p><p>Advanced overrides: <code>--cb-card-header-bg</code>, <code>--cb-card-header-color</code>, <code>--cb-card-bg</code>, <code>--cb-card-color</code> and <code>--cb-card-border-color</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_TEXT="<p>Use <code>card=h1</code> to <code>card=h6</code> or <code>card=v1</code> to <code>card=v6</code>. For every variant, the title is horizontal and above the content. A header is displayed only with an explicit non-empty <code>labels=</code>.</p><p>Card titles use <code>h4</code> by default. Add <code>|h1</code> to <code>|h6</code> after the title to select a heading level, or <code>|remX</code> / <code>|remX.X</code> to set a positive visual size while keeping the semantic <code>h4</code> level. Spaces around the last <code>|</code> are optional and suffixes are case-insensitive. An unrecognised suffix remains part of the complete title, which uses the default <code>h4</code> rendering.</p><p><code>{CBStats id=15 field=Group output=pie labels=&quot;title=Distribution | h4&quot; card=h1}</code><br><code>{CBStats id=15 field=Group output=pie labels=&quot;title=Distribution | rem1.25&quot; card=h1}</code></p><p>Override colours in Joomla <code>user.css</code> using the <code>--cb-card-*</code> custom properties.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DIMENSIONS_LABEL="Responsive chart dimensions"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DIMENSIONS_TEXT="<p><code>width=</code> controls the chart container width and <code>height=</code> its height. Accepted values are a positive integer, <code>px</code> or <code>%</code>. A bare number becomes pixels: <code>width=350</code> equals <code>width=350px</code>. CSS expressions, other units and values above 100% or 5000px are rejected.</p><p><strong>Without options:</strong> Pie uses 80% of its container, is centred and is capped at 350px. Bar, Histogram, Line and Radar use 100% of the available width. No chart should create horizontal scrolling by default.</p><p><strong>Explicit width:</strong> <code>width=100%</code> lets Pie fill the Card and removes its 350px maximum. <code>width=300</code> fixes 300px. Prefer percentages inside small containers.</p><p><strong>Explicit height:</strong> this disables the chart’s maintained aspect ratio. <code>height=280</code> means 280px. <code>height=80%</code> is useful only when the parent already has a defined CSS height; otherwise use pixels.</p><p><strong>Examples:</strong><br><code>{CBStats id=15 field=Group output=pie}</code><br><code>{CBStats id=15 field=Group output=pie width=100%}</code><br><code>{CBStats id=15 field=Group output=bar width=100% height=280}</code><br><code>{CBStats id=15 field=Group output=radar width=80% height=320px}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_LABEL="Hide chart result elements"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_TEXT="<p><code>hide=</code> accepts only <code>total</code>, <code>values</code> and <code>graph</code>, combined with <code>|</code> in any order. <code>total</code> hides only the displayed total, <code>values</code> hides the textual labels and values list below the graph without changing the graph itself, and <code>graph</code> hides the drawing while retaining that lightweight textual list. Without <code>hide=</code>, everything is displayed. Hiding all three elements produces a message instead of an empty block. The former <code>total=hide</code> syntax is rejected; use <code>hide=&quot;total&quot;</code>.</p><p><code>hide=&quot;total|values&quot;</code>: complete graph only. <code>hide=&quot;graph|total&quot;</code>: textual list only. <code>hide=&quot;graph&quot;</code>: textual list and total. <code>hide=&quot;values&quot;</code>: complete graph and total. <code>hide=&quot;graph|values&quot;</code>: total only.</p><p><code>{CBStats id=15 field=GroupeVcmb output=bar hide=&quot;values&quot;}</code><br><code>{CBStats id=15 field=age output=histogram groups=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;total|values&quot;}</code><br><code>{CBStats id=15 field=age output=radar groups=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;graph|total&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_TITLE="Manual version to keep"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TITLE="Title"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TITLES="Titles"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_VALUES="Values"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TOTAL="Total"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SYNTAX_LABEL="Manual CBStats syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPY="📋 Copy syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPIED="✓ Syntax copied"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPY_FAILED="Automatic copy failed. Select the syntax and use Ctrl+C."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_LABEL="Manual export"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_TEXT="<p>Only <code>export=manual</code> displays the final results and visible <code>source=manual</code> syntax below Pie, Bar and Table outputs. Final labels after <code>titles=</code>, additions and sorting are written directly into <code>values=</code>; <code>titles=</code> is not copied.</p><p><code>{CBStats id=15 field=Route output=pie labels='title=👥 Total registrations' export=manual}</code></p><p>The centered <strong>Copy syntax</strong> button copies exactly the syntax shown above it. On an already manual source, the normalized final syntax is displayed once without nesting.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_SOURCE="source must be view or manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_MANUAL_OUTPUT="Manual mode supports only pie, bar, histogram, line, radar, table and total outputs."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUES_REQUIRED="CBStats: no valid manual values were provided."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUE_INVALID="CBStats: invalid manual value “%s”."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_MANUAL_LABEL="Manual mode — preserve statistics"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_MANUAL_TEXT="<p><code>source=manual</code> uses only <code>values=</code>, without a ContentBuilder view, field or query. It preserves results when a view is reused.</p><p><code>{CBStats source=manual output=pie values='100 km=45;150 km=47;200 km=38;200 km (Formula)=30' labels='title=👥 Total registrations'}</code></p><p>Outputs: <code>pie</code>, <code>bar</code>, <code>table</code>, <code>total</code>. <code>add=</code>, <code>titles=</code>, <code>labels=</code>, <code>sort=none|title|label|value</code> and <code>dir=asc|desc</code> remain available. Duplicate labels are added. In labels, use <code>\;</code>, <code>\=</code> and <code>\\</code>. Do not add <code>id=</code> or <code>field=</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_VALUE="Value"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_COUNT="Count"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TOTAL="Displayed total"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TOTAL_SEPARATOR=":"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_UNAVAILABLE="Statistics unavailable"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_INVALID_REQUEST="Invalid statistics request."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_VALIDATION_INTRO="CBStats cannot be displayed. Correction required:"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_SYNTAX_HELP="Help with CBStats syntax"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EMPTY_VALUE="empty value"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_UNKNOWN_OPTION="The CBStats option \"%1$s\" is unknown (received value: \"%2$s\")."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_REMOVED_OPTION="The CBStats option \"%1$s\" has been removed. %2$s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_INVALID_OPTION_VALUE="The CBStats option \"%1$s\" has the invalid value \"%2$s\". %3$s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_SOURCE="Use source=view or source=manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_ID="Use one strictly positive view ID, for example id=15."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_NUMERIC_SYNTAX="Write numeric options without quotation marks, for example id=15, limit=10 or target=200."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_IDSUM="Use two to five unique positive view IDs separated with +, for example idsum=15+16."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_ID_CONFLICT="Use either id or idsum, never both."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_OUTPUT="Allowed outputs: total, table, pie, bar, histogram, line, radar, json, sum, min, max, avg, remaining, percentage, progress, distinct and view_name."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_TARGET="With output=remaining or output=progress, provide a positive number without quotation marks, for example target=200."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_PERCENTAGE_VALUE="With output=percentage, provide field= and a non-empty value= selection."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_TARGET_OUTPUT="target can only be used with output=remaining or output=progress."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REMAINING_LABEL="Remaining before a target"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REMAINING_TEXT="<p><code>output=remaining target=200</code> subtracts the normal filtered CBStats total from the positive target and never returns less than zero.</p><p>All normal view, source, permission and record filters are applied first. Example: <code>{CBStats id=15 output=remaining target=200}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PERCENTAGE_LABEL="Percentage of a selected value"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PERCENTAGE_TEXT="<p><code>output=percentage</code> returns the share of records matching <code>field=</code> and <code>value=</code> within the population restricted by the optional <code>filter[field]</code>/<code>filter[value]</code>. Empty selections are rejected and a zero population returns 0%.</p><p>Example: <code>{CBStats id=15 field=Gender value=&quot;M&quot; output=percentage}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PROGRESS_LABEL="Progress towards a target"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PROGRESS_TEXT="<p><code>output=progress target=200</code> returns the normal filtered total as a percentage of a positive target, capped at 100%.</p><p>Example: <code>{CBStats id=15 output=progress target=200}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISTINCT_LABEL="Distinct values"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISTINCT_TEXT="<p><code>output=distinct</code> counts the distinct non-empty values of <code>field=</code> after all normal CBStats filters, view/source restrictions and permissions have been applied.</p><p>It supports <code>filter[field]</code>, <code>filter[value]</code>, the same-field <code>value=</code> shorthand, <code>*</code> wildcards and <code>|</code> alternatives. Examples: <code>{CBStats id=15 field=Department output=distinct}</code> and <code>{CBStats id=15 field=Department value=&quot;78|60&quot; output=distinct}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_MANUAL_OUTPUT="With source=manual, use total, table, pie, bar, histogram, line or radar."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_IDSUM_OUTPUT="output=view_name cannot be used with idsum."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_FIELD="Provide field= with an element available for statistics in the selected view."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_FILTER="Provide filter[field] and filter[value] together, or use value= as the same-field shorthand."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_SORT="Use sort=none, sort=title or sort=value."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_MANUAL_SORT="With source=manual, use sort=none, sort=title, sort=label or sort=value."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_DIR="Use dir=asc or dir=desc."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_LIMIT="Use a strictly positive integer, for example limit=10."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_HIDE="Use total, values or graph separated with |. Do not hide every available result element."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_EXPORT="The only allowed value is export=manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_BACKGROUND="Use transparent, a valid hexadecimal/rgb/rgba colour or a supported safe colour name."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_ADD="Use Label=SignedInteger entries separated with semicolons."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_TITLES="Use Original=Display title entries separated with semicolons, with neither side empty."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_LABELS="Use labels with unique title, category, value or total keys, for example labels=\"title=Groups;category=Group;value=Registrations;total=Displayed total\"."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_LABELS_TABLE="The category and value labels apply only to output=table."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_LABELS_TOTAL="Use labels=\"total=Displayed total\" with table or chart outputs."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_LABELS_TITLE="Use labels=\"title=Groups\"; title is not available with output=json."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_LABELS_HEADERS="Replace headers with labels=\"category=Group;value=Registrations\"."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_GROUPS="Use minimum-maximum, maximum-, minimum+, or value,value=Label groups separated with semicolons."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_VALUES="With source=manual, provide values as Label=Number entries separated with semicolons."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_MESSAGE="CBStats DEBUG: %s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_ID_REQUIRED="The id parameter is required."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_ID_AND_IDSUM="id and idsum cannot be used together."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_IDSUM_TOO_FEW="idsum requires at least two view identifiers."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_IDSUM_TOO_MANY="idsum accepts at most five view identifiers."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_IDSUM_INVALID="idsum contains an invalid view identifier."
