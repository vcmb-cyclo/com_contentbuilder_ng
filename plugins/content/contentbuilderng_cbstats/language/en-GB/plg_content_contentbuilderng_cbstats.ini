PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_XML_DESCRIPTION="CBStats inserts statistics directly into Joomla content from one ContentBuilder NG view or merges two to five views with idsum. export=manual provides a frozen reusable syntax, limit restricts final values and hide controls chart presentation."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_LABEL="Hide chart result elements"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_TEXT="<p><code>hide=</code> accepts only <code>total</code>, <code>values</code> and <code>graph</code>, combined with <code>|</code> in any order. <code>total</code> hides only the displayed total, <code>values</code> hides data labels and numeric values while keeping the graph visible, and <code>graph</code> hides the drawing while retaining lightweight textual labels and values. Without <code>hide=</code>, everything is displayed. Hiding all three elements produces a message instead of an empty block. The former <code>total=hide</code> syntax is rejected; use <code>hide=&quot;total&quot;</code>.</p><p><code>hide=&quot;total|values&quot;</code>: graph only. <code>hide=&quot;graph|total&quot;</code>: labels and values only. <code>hide=&quot;graph|values&quot;</code>: total only.</p><p><code>{CBStats id=25 field=age output=pie hide=&quot;values&quot;}</code><br><code>{CBStats id=25 field=age output=histogram ranges=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;total|values&quot;}</code><br><code>{CBStats id=25 field=age output=radar ranges=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;graph|total&quot;}</code><br><code>{CBStats id=25 field=date_inscription output=line sort=value dir=asc limit=30 hide=&quot;values&quot;}</code></p>"
