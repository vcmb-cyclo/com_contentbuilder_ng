PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_TEXT="<p>Only <code>export=manual</code> displays the final results and visible <code>source=manual</code> syntax below Pie, Bar and Table outputs. Final labels after <code>titles=</code>, additions and sorting are written directly into <code>values=</code>; <code>titles=</code> is not copied.</p><p><code>{CBStats id=25 field=Route output=pie title='👥 Total registrations' export=manual}</code></p><p>The centered <strong>Copy syntax</strong> button copies exactly the syntax shown above it. On an already manual source, the normalized final syntax is displayed once without nesting.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_SOURCE="source must be view or manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_MANUAL_OUTPUT="Manual mode supports only pie, bar, histogram, line, radar, table and total outputs."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUES_REQUIRED="CBStats: no valid manual values were provided."
