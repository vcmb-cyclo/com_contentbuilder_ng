PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HIDE_INVALID_ITEM="Invalid statistics request — suspect option: hide. Suspect item: %s. Allowed values: total, values, graph."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HIDE_INVALID_SEPARATOR="Invalid statistics request — suspect option: hide. Suspect item: %s. Expected separator: |."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HIDE_NOT_APPLICABLE="CBStats: hide=\"%1$s\" does not apply to output=%2$s."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HIDE_ALL_HIDDEN="CBStats: hide hides all result elements."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HIDE_LEGACY_TOTAL="CBStats: the total=hide option is no longer supported. Use hide=\"total\"."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_TOTAL="ViewID=%1$s; total=%2$s."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_AGGREGATE="ViewID=%1$s; %2$s=%3$s."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_NON_NUMERIC="null (non-numeric values)"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_ITEMS="ViewID=%1$s; %2$s items=%3$s."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_NO_DATA="No data available"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_PIE_ARIA_LABEL="Pie chart: %s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_BAR_ARIA_LABEL="Horizontal bar chart: %s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_CHART_ARIA_LABEL="%1$s chart: %2$s"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_CHART_UNAVAILABLE="Chart unavailable. The detailed data is listed below."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_RADAR_TOO_FEW="A radar chart requires at least 3 values."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_RADAR_TOO_MANY="A radar chart accepts at most %s values. Use limit or fewer ranges."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_LABEL="CBStats: purpose, syntax and outputs"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REFERENCE_LABEL="Complete reference and processing order"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REFERENCE_TEXT="<p><strong>Source:</strong> <code>source</code>, <code>id</code>, <code>idsum</code>, <code>values</code>. <strong>Data:</strong> <code>field</code>, <code>filter[field]</code>, <code>filter[value]</code>, <code>value</code>. <strong>Calculation:</strong> <code>add</code>, <code>titles</code>, <code>ranges</code>, <code>sort</code>, <code>dir</code>, <code>limit</code>. <strong>Output:</strong> <code>output</code>, <code>headers</code>, <code>title</code>, <code>background</code>, <code>hide</code>, <code>card</code>, <code>width</code>, <code>height</code>, <code>export</code>. <strong>Diagnostics:</strong> <code>debug</code>. The former <code>total=hide</code> is rejected; use <code>hide=&quot;total&quot;</code>.</p><p>Normal order: ACL → filters → grouping → <code>add</code> → zero normalisation → <code>titles</code> → <code>ranges</code> when required → sorting → <code>limit</code> → output and presentation.</p><p><strong>Complete example:</strong><br><code>{CBStats id=15 field=Group filter[field]=Status filter[value]=&quot;Published*&quot; add=&quot;External=2&quot; titles=&quot;External=Guests&quot; sort=value dir=desc limit=10 output=bar title=&quot;Distribution&quot; hide=&quot;values&quot; card=h1 width=100% height=320 export=manual}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ADD_LABEL="Filters, sorting and external values"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ADD_TEXT="<p><strong>Filters on another field:</strong> <code>field=Element-1</code> is the field grouped and displayed, while <code>filter[field]=Element-2</code> is used only to select records. Supply <code>filter[field]</code> and <code>filter[value]</code> together: <code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]='Dét* | 3 | 4' output=bar}</code>. <code>*</code> is a wildcard, <code>|</code> separates alternatives and surrounding spaces are trimmed. Without a wildcard, matching is exact.</p><p><strong>Same-field shorthand:</strong> <code>{CBStats id=15 field=Element-2 value='Dét* | 3 | 4' output=bar}</code> is strictly equivalent to filtering <code>Element-2</code> with the complete syntax. Use <code>value=</code> only when the filter applies to <code>field=</code>; use <code>filter[field]</code> and <code>filter[value]</code> when the fields differ. Do not confuse <code>value=</code> with <code>values=</code>, which is reserved for <code>source=manual</code>.</p><p><strong>Signed external deltas with add=:</strong> use a positive integer to add, zero for no change, or a negative integer to remove occurrences, for example <code>add='100 km=5;150 km=-2'</code>. If the final calculated result is negative, CBStats temporarily uses <code>0</code> before titles, sorting, percentages and output without changing source data. A later zero or positive result is used normally. Repeated labels are cumulative.</p><p><strong>Display labels with titles=:</strong> <code>titles='Original=Display title;Other=Other title'</code> renames labels for display only. <code>add</code> uses original labels first. Unmapped labels remain unchanged, and identical display titles do not merge categories. Semicolons delimit mappings; the first equals sign separates the original and display title.</p><p><strong>Sorting:</strong> <code>sort=none|title|value</code> and <code>dir=asc|desc</code> apply to Table, JSON, Pie and Bar. <code>sort=title</code> uses final display titles. Logical order: data → filters → grouping → add → normalization → titles → sorting → output.</p><p><strong>Examples:</strong><br><code>{CBStats id=25 field=Route output=pie add='100 km=-3'}</code><br><code>{CBStats id=25 field=Route output=table titles='1=Group 1;2=Group 2'}</code><br><code>{CBStats id=25 field=Route output=bar add='1=-2;2=3' titles='1=Group 1;2=Group 2' sort=value dir=desc}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DEBUG_LABEL="URL/API, API + Rights and DEBUG"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PRESENTATION_LABEL="Total label and background"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HEADERS_LABEL="Table column headers"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HEADERS_TEXT="<p><code>headers='Route=Distance;Total=Participants'</code> customizes only the two column headers of <code>output=table</code>. Unmapped headers remain unchanged; unknown keys and empty labels are ignored. Pie and Bar legends remain unchanged. <code>title=</code>, <code>titles=</code> and <code>headers=</code> are independent. <code>export=manual</code> preserves the mapping.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PRESENTATION_TEXT="<p><code>title='👥 Total registrations'</code> customizes the global total label for Table, Pie and Bar.</p><p><code>titles='Original=Display title'</code> customizes individual category labels.</p><p><code>headers='Route=Distance;Total=Participants'</code> customizes only the two column headers of <code>output=table</code>. Unmapped headers remain unchanged; unknown keys and empty labels are ignored. Pie and Bar legends remain unchanged.</p><p><code>title=</code>, <code>titles=</code> and <code>headers=</code> are independent.</p><p>CBStats adds the separator for the active language when it is omitted and does not duplicate an existing colon.</p><p><code>background=</code> accepts <code>transparent</code>, hexadecimal colours, <code>rgb()</code>, <code>rgba()</code> and the documented safe named colours.</p><p><code>{CBStats id=25 field=Route output=table headers='Route=Distance;Total=Participants'}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DEBUG_TEXT="<p><strong>URL/API:</strong> all data outputs are testable through <code>action=cbstats</code>: <code>json</code>, <code>table</code>, <code>pie</code>, <code>bar</code>, <code>histogram</code>, <code>line</code>, <code>radar</code>, <code>total</code>, <code>sum</code>, <code>min</code>, <code>max</code>, <code>avg</code> and <code>form_name</code>. List and chart names return normalized data without HTML. <code>ranges</code>, <code>add</code>, <code>titles</code>, <code>sort</code>, <code>dir</code> and <code>limit</code> use the article-tag validation path.</p><p><strong>API + Rights:</strong> check ACLs, fields published and enabled for API/Stats, the STATS permission and the view's <strong>API</strong> tab. No request bypasses view or field permissions.</p><p><strong>DEBUG:</strong> safe diagnostics follow the view DEBUG setting. DEBUG grants no additional right and never bypasses ACLs.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_TEXT="<p>CBStats displays dynamic statistics from ContentBuilder NG views directly inside Joomla articles while preserving view access rights and configuration.</p><p><strong>Simple example:</strong> <code>{CBStats id=ViewID output=total}</code>. See the sections below for all syntax options.</p><p><strong>Syntax:</strong> <code>{CBStats id=ViewID ...}</code>. The default output is <code>total</code>.</p><p><strong>Available outputs:</strong></p><ul><li><code>total</code>: matching record count.</li><li><code>form_name</code>: view title or name.</li><li><code>table</code>: HTML value/count table.</li><li><code>sum</code>, <code>min</code>, <code>max</code>: numeric aggregates; ISO dates support chronological min/max.</li><li><code>avg</code>: arithmetic mean of numeric values (empty/non-numeric values are ignored).</li><li><code>json</code>: raw <code>[{label,value}]</code> array.</li><li><code>pie</code>: responsive Pie chart with dynamic colours, localized percentages, tooltip, detailed legend and total.</li><li><code>bar</code>: responsive horizontal Bar chart with values, percentages, tooltip, legend, total and sorting.</li><li><code>histogram</code>: numeric distribution grouped into explicit <code>ranges</code>, for example <code>ranges='18-29;30-39;40-49;50+'</code>.</li><li><code>line</code>: ordered trend chart, commonly with date or sequential categories, for example <code>output=line limit=12</code>.</li><li><code>radar</code>: multi-axis comparison chart; use 3–8 categories, for example <code>field=Distance output=radar ranges='0-100;101-200;201+'</code>.</li></ul><p>Table, JSON, Pie, Bar, Histogram, Line and Radar use the same normalized PHP engine; <code>avg</code> uses the same normalized numeric values.</p><p><strong>Simple examples:</strong><br><code>{CBStats id=25 output=total}</code><br><code>{CBStats id=25 field=Route output=table}</code><br><code>{CBStats id=25 field=Route output=json}</code><br><code>{CBStats id=25 field=Route output=pie}</code><br><code>{CBStats id=25 field=Route output=bar sort=value dir=desc}</code><br><code>{CBStats id=25 field=Distance output=avg}</code><br><code>{CBStats id=25 field=Distance output=histogram ranges='0-50;51-100;101+'}</code><br><code>{CBStats id=25 field=Date output=line limit=12}</code><br><code>{CBStats id=25 field=Score output=radar}</code></p><p><strong>Merging views with idsum:</strong> <code>idsum=25+27</code> replaces <code>id=</code> and accepts two to five unique view identifiers separated by <code>+</code>. Each view applies permissions and filters before values with the same exact label are added. Then <code>add=</code>, zero normalization, <code>titles=</code>, sorting and output are applied once to the merged result. <code>output=form_name</code> is not available with <code>idsum</code>. Examples: <code>{CBStats idsum=25+27 field=&quot;Route&quot; output=&quot;table&quot; title=&quot;Monticyclo / Montigravel&quot;}</code> and <code>{CBStats idsum=31+32+33+34+35 field=&quot;Distance&quot; output=&quot;bar&quot; title=&quot;BRM&quot;}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_FILTERS_TEXT="<p><strong>Filtering on another field:</strong> <code>field=Element-1</code> is the field grouped and displayed in the chart. <code>filter[field]=Element-2</code> is the field used to filter records. <code>filter[value]=&quot;Dét* | 3 | 4&quot;</code> keeps values beginning with <code>Dét</code>, or the exact value <code>3</code>, or the exact value <code>4</code>. The <code>|</code> character separates alternatives, surrounding spaces are ignored and, without <code>*</code>, matching is exact.</p><p><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code></p><p><strong>Shortcut for the same field:</strong> when the filter applies to the displayed field, <code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code> is equivalent to <code>{CBStats id=15 field=Element-2 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code>. When the fields differ, use <code>filter[field]</code> and <code>filter[value]</code>. Do not confuse <code>value=</code> with <code>values=</code>, which is reserved for <code>source=manual</code>.</p><p><strong>Examples:</strong><br><code>{CBStats id=25 field=Route output=pie add='100 km=-3'}</code><br><code>{CBStats id=25 field=Route output=table titles='1=Group 1;2=Group 2'}</code><br><code>{CBStats id=25 field=Route output=bar add='1=-2;2=3' titles='1=Group 1;2=Group 2' sort=value dir=desc}</code><br><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code><br><code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_LIMIT="limit must be a strictly positive integer."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_TOTAL="total accepts only the value hide."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISPLAY_OPTIONS_LABEL="Result limit and total display"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISPLAY_OPTIONS_TEXT="<p><code>limit=10</code> keeps the first 10 statistical values after <code>sort=</code> and <code>dir=</code>. Without <code>limit</code>, all values are rendered. Numeric options must be strictly positive integers written without quotation marks.</p><p>After limiting, the displayed total and chart percentages are recalculated from the retained values only. No Other category is added.</p><p><code>{CBStats id=15 field=Town output=table sort=value dir=desc limit=10}</code><br><code>{CBStats idsum=15+16 field=Club output=bar sort=value dir=desc limit=15}</code></p>"
