PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_MISSING_TITLES="CBStats data set warning: %s has no usable [titles] section. Original values are used."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_INVALID_ENTRIES="CBStats data set warning: %s contains invalid mappings, which were ignored."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_TITLESET_LABEL="Reusable title sets"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_TITLESET_TEXT="<p><code>titleset=&quot;departements-fr-FR.ini&quot;</code> loads reusable category labels from a managed INI file. Site files in <code>media/contentbuilderng/cbstats/titlesets</code> override provided files with the same name in <code>media/com_contentbuilderng/cbstats/titlesets</code>. Inline <code>titles=</code> mappings have priority.</p><p>Missing or invalid files never block output: original values remain visible. When Joomla Debug is enabled, CBStats records a Warning. Manage files from ContentBuilder NG → About → CBStats title sets.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_GROUPSET_LABEL="groupset — Reusable value groups"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_GROUPSET_TEXT="<p><code>groups=</code> defines value groups inline. Use inclusive numeric intervals such as <code>18-24</code>, <code>18-</code> and <code>70+</code>, or explicit non-contiguous values with a display label, such as <code>1,2,7,9=Group 1</code>. Values that match no group remain as individual categories. Overlapping groups are counted independently; the displayed total is therefore the sum of all displayed results and may count one record more than once.</p><p><code>groupset=&quot;ages-fr-FR.ini&quot;</code> loads reusable value groups from a managed INI file containing a <code>[groups]</code> section. Each key is an interval or comma-separated value list, and its INI value is the display label.</p><p><strong>Complete examples:</strong><br><code>{CBStats id=15 field=Category output=bar groups=&quot;1,2,7,9=Group 1;3,4,8=Group 2&quot;}</code><br><code>{CBStats id=15 field=Age output=histogram groupset=&quot;ages-fr-FR.ini&quot;}</code></p><p>Manage these files under ContentBuilder NG → About → CBStats Data sets, using the Groups type. Inline <code>groups=</code> has priority over <code>groupset=</code>; inline <code>titles=</code> overrides group labels.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TITLESET_WARNING_MISSING_DATA="CBStats data set %s has no valid [titles] or [groups] section."
