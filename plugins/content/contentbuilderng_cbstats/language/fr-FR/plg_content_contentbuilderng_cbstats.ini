PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_LABEL="CBStats : finalité, syntaxe et sorties"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REFERENCE_LABEL="Référence complète et ordre d’exécution"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_REFERENCE_TEXT="<p><strong>Source :</strong> <code>source</code>, <code>id</code>, <code>idsum</code>, <code>values</code>. <strong>Données :</strong> <code>field</code>, <code>filter[field]</code>, <code>filter[value]</code>, <code>value</code>. <strong>Calcul :</strong> <code>add</code>, <code>titles</code>, <code>ranges</code>, <code>sort</code>, <code>dir</code>, <code>limit</code>. <strong>Sortie :</strong> <code>output</code>, <code>headers</code>, <code>title</code>, <code>background</code>, <code>hide</code>, <code>card</code>, <code>width</code>, <code>height</code>, <code>export</code>. <strong>Diagnostic :</strong> <code>debug</code>. L’ancienne option <code>total=hide</code> est refusée ; utilisez <code>hide=&quot;total&quot;</code>.</p><p>Ordre normal : ACL → filtres → regroupement → <code>add</code> → normalisation à zéro → <code>titles</code> → <code>ranges</code> si nécessaire → tri → <code>limit</code> → output et présentation.</p><p><strong>Exemple complet :</strong><br><code>{CBStats id=15 field=Groupe filter[field]=Statut filter[value]=&quot;Publié*&quot; add=&quot;Externe=2&quot; titles=&quot;Externe=Invités&quot; sort=value dir=desc limit=10 output=bar title=&quot;Répartition&quot; hide=&quot;values&quot; card=h1 width=100% height=320 export=manual}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ADD_LABEL="Filtres, tri et valeurs externes"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ADD_TEXT="<p><strong>Filtre portant sur un autre champ&nbsp;:</strong> <code>field=Element-1</code> désigne le champ regroupé et affiché, tandis que <code>filter[field]=Element-2</code> sert uniquement à sélectionner les enregistrements. Fournissez ensemble <code>filter[field]</code> et <code>filter[value]</code>&nbsp;: <code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]='Dét* | 3 | 4' output=bar}</code>. <code>*</code> est un joker, <code>|</code> sépare les alternatives et les espaces autour des valeurs sont ignorés. Sans joker, la comparaison est exacte.</p><p><strong>Raccourci sur le même champ&nbsp;:</strong> <code>{CBStats id=15 field=Element-2 value='Dét* | 3 | 4' output=bar}</code> équivaut strictement au filtre complet portant sur <code>Element-2</code>. Utilisez <code>value=</code> uniquement lorsque le filtre porte sur <code>field=</code>&nbsp;; si les champs diffèrent, utilisez <code>filter[field]</code> et <code>filter[value]</code>. Ne confondez pas <code>value=</code> avec <code>values=</code>, réservé à <code>source=manual</code>.</p><p><strong>Deltas externes signés avec add=&nbsp;:</strong> utilisez un entier positif pour ajouter, zéro pour ne rien modifier ou un entier négatif pour retirer des occurrences, par exemple <code>add='100 km=5;150 km=-2'</code>. Si le résultat final calculé est négatif, CBStats utilise temporairement <code>0</code> avant les titres, le tri, les pourcentages et le rendu, sans modifier les données sources. Un résultat ultérieur nul ou positif est utilisé normalement. Les libellés répétés sont cumulés.</p><p><strong>Libellés d'affichage avec titles=&nbsp;:</strong> <code>titles='Original=Titre affiché;Autre=Autre titre'</code> renomme uniquement l'affichage. <code>add</code> utilise d'abord les libellés originaux. Les libellés non indiqués restent inchangés et deux titres affichés identiques ne fusionnent pas les catégories. Le point-virgule sépare les mappings&nbsp;; le premier signe égal sépare l'original du titre affiché.</p><p><strong>Tri&nbsp;:</strong> <code>sort=none|title|value</code> et <code>dir=asc|desc</code> s'appliquent à Table, JSON, Pie et Bar. <code>sort=title</code> utilise les titres affichés finaux. Ordre logique&nbsp;: données → filtres → regroupement → add → normalisation → titles → tri → output.</p><p><strong>Exemples&nbsp;:</strong><br><code>{CBStats id=25 field=Parcours output=pie add='100 km=-3'}</code><br><code>{CBStats id=25 field=Parcours output=table titles='1=Groupe 1;2=Groupe 2'}</code><br><code>{CBStats id=25 field=Parcours output=bar add='1=-2;2=3' titles='1=Groupe 1;2=Groupe 2' sort=value dir=desc}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DEBUG_LABEL="URL/API, API + Droits et DEBUG"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PRESENTATION_LABEL="Libellé du total et arrière-plan"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HEADERS_LABEL="En-têtes des colonnes du tableau"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HEADERS_TEXT="<p><code>headers='Dpt=Département;Total=Qté'</code> personnalise uniquement les deux en-têtes de colonnes de <code>output=table</code>. Les en-têtes non mappés restent inchangés ; les clés inconnues et les libellés vides sont ignorés. Les légendes Pie et Bar restent inchangées. <code>title=</code>, <code>titles=</code> et <code>headers=</code> sont indépendants. <code>export=manual</code> conserve le mappage.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_PRESENTATION_TEXT="<p><code>title='👥 Total des inscrits'</code> personnalise le libellé global du total pour Table, Pie et Bar.</p><p><code>titles='Original=Titre affiché'</code> personnalise les libellés individuels des catégories.</p><p>CBStats ajoute le séparateur adapté à la langue active lorsqu’il est absent et ne double pas un caractère « : » déjà présent.</p><p><code>background=</code> accepte <code>transparent</code>, les couleurs hexadécimales, <code>rgb()</code>, <code>rgba()</code> et les couleurs nommées sûres documentées.</p><p><code>{CBStats id=25 field=Parcours output=pie title='👥 Total des inscrits'}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DEBUG_TEXT="<p><strong>URL/API&nbsp;:</strong> tous les outputs de données sont testables avec <code>action=cbstats</code>&nbsp;: <code>json</code>, <code>table</code>, <code>pie</code>, <code>bar</code>, <code>histogram</code>, <code>line</code>, <code>radar</code>, <code>total</code>, <code>sum</code>, <code>min</code>, <code>max</code>, <code>avg</code> et <code>form_name</code>. Les noms d’outputs de liste et de graphique retournent les données normalisées sans HTML. <code>ranges</code>, <code>add</code>, <code>titles</code>, <code>sort</code>, <code>dir</code> et <code>limit</code> utilisent la validation des balises d’article.</p><p><strong>API + Droits&nbsp;:</strong> vérifiez les ACL, les champs publiés et autorisés pour API/Stats, la permission STATS et l’onglet <strong>API</strong> de la vue. Aucune requête ne contourne les droits de la vue ou du champ.</p><p><strong>DEBUG&nbsp;:</strong> les diagnostics sûrs suivent le réglage DEBUG de la vue. DEBUG ne donne aucun droit supplémentaire et ne contourne jamais les ACL.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_TEXT="<p>CBStats affiche des statistiques dynamiques provenant de vues ContentBuilder NG directement dans les articles Joomla, tout en conservant les droits d’accès et la configuration des vues.</p><p><strong>Exemple simple :</strong> <code>{CBStats id=IdVue output=total}</code>. Consultez les sections ci-dessous pour découvrir toutes les options de syntaxe.</p><p><strong>Syntaxe&nbsp;:</strong> <code>{CBStats id=IdVue ...}</code>. La sortie par défaut est <code>total</code>.</p><p><strong>Outputs disponibles&nbsp;:</strong></p><ul><li><code>total</code>&nbsp;: nombre d'enregistrements correspondants.</li><li><code>form_name</code>&nbsp;: titre ou nom de la vue.</li><li><code>table</code>&nbsp;: tableau HTML valeur/nombre.</li><li><code>sum</code>, <code>min</code>, <code>max</code>&nbsp;: agrégats numériques&nbsp;; les dates ISO acceptent un min/max chronologique.</li><li><code>avg</code>&nbsp;: moyenne arithmétique des valeurs numériques (les valeurs vides ou non numériques sont ignorées).</li><li><code>json</code>&nbsp;: tableau brut <code>[{label,value}]</code>.</li><li><code>pie</code>&nbsp;: graphique circulaire responsive avec couleurs dynamiques, pourcentages localisés, infobulle, légende détaillée et total.</li><li><code>bar</code>&nbsp;: histogramme horizontal responsive avec valeurs, pourcentages, infobulle, légende, total et tri.</li><li><code>histogram</code>&nbsp;: distribution numérique regroupée dans des <code>ranges</code> explicites, par exemple <code>ranges='18-29;30-39;40-49;50+'</code>.</li><li><code>line</code>&nbsp;: courbe de tendance ordonnée, souvent avec des dates ou catégories séquentielles, par exemple <code>output=line limit=12</code>.</li><li><code>radar</code>&nbsp;: comparaison multi-axes&nbsp;; utilisez 3 à 8 catégories, par exemple <code>field=Distance output=radar ranges='0-100;101-200;201+'</code>.</li></ul><p>Table, JSON, Pie, Bar, Histogram, Line et Radar utilisent le même moteur PHP normalisé&nbsp;; <code>avg</code> utilise les mêmes valeurs numériques normalisées.</p><p><strong>Exemples simples&nbsp;:</strong><br><code>{CBStats id=25 output=total}</code><br><code>{CBStats id=25 field=Parcours output=table}</code><br><code>{CBStats id=25 field=Parcours output=json}</code><br><code>{CBStats id=25 field=Parcours output=pie}</code><br><code>{CBStats id=25 field=Parcours output=bar sort=value dir=desc}</code><br><code>{CBStats id=25 field=Distance output=avg}</code><br><code>{CBStats id=25 field=Distance output=histogram ranges='0-50;51-100;101+'}</code><br><code>{CBStats id=25 field=Date output=line limit=12}</code><br><code>{CBStats id=25 field=Score output=radar}</code></p><p><strong>Fusionner des vues avec idsum&nbsp;:</strong> <code>idsum=25+27</code> remplace <code>id=</code> et accepte de deux à cinq identifiants de vues uniques séparés par <code>+</code>. Chaque vue applique les droits et les filtres avant l’addition des valeurs portant exactement le même libellé. <code>add=</code>, la normalisation à zéro, <code>titles=</code>, le tri et l’output sont ensuite appliqués une seule fois au résultat fusionné. <code>output=form_name</code> n’est pas disponible avec <code>idsum</code>. Exemples&nbsp;: <code>{CBStats idsum=25+27 field=&quot;Parcours&quot; output=&quot;table&quot; title=&quot;Monticyclo / Montigravel&quot;}</code> et <code>{CBStats idsum=31+32+33+34+35 field=&quot;Distance&quot; output=&quot;bar&quot; title=&quot;BRM&quot;}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_FILTERS_TEXT="<p><strong>Filtrer sur un autre champ&nbsp;:</strong> <code>field=Element-1</code> est le champ regroupé et affiché dans le graphique. <code>filter[field]=Element-2</code> est le champ utilisé pour filtrer les enregistrements. <code>filter[value]=&quot;Dét* | 3 | 4&quot;</code> conserve les valeurs commençant par <code>Dét</code>, ou la valeur exacte <code>3</code>, ou la valeur exacte <code>4</code>. Le caractère <code>|</code> sépare les alternatives, les espaces autour sont ignorés et, sans <code>*</code>, la correspondance est exacte.</p><p><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code></p><p><strong>Raccourci sur le même champ&nbsp;:</strong> lorsque le filtre porte sur le champ affiché, <code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code> équivaut à <code>{CBStats id=15 field=Element-2 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code>. Lorsque les champs diffèrent, utilisez <code>filter[field]</code> et <code>filter[value]</code>. Ne confondez pas <code>value=</code> avec <code>values=</code>, réservé à <code>source=manual</code>.</p><p><strong>Exemples&nbsp;:</strong><br><code>{CBStats id=25 field=Parcours output=pie add='100 km=-3'}</code><br><code>{CBStats id=25 field=Parcours output=table titles='1=Groupe 1;2=Groupe 2'}</code><br><code>{CBStats id=25 field=Parcours output=bar add='1=-2;2=3' titles='1=Groupe 1;2=Groupe 2' sort=value dir=desc}</code><br><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code><br><code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_LIMIT="limit doit être un entier strictement positif."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_TOTAL="total accepte uniquement la valeur hide."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISPLAY_OPTIONS_LABEL="Limite du résultat et affichage du total"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISPLAY_OPTIONS_TEXT="<p><code>limit=10</code> conserve les 10 premières valeurs statistiques après <code>sort=</code> et <code>dir=</code>. Sans <code>limit</code>, toutes les valeurs sont rendues. Les options numériques doivent être des entiers strictement positifs écrits sans guillemets.</p><p>Après la limitation, le total affiché et les pourcentages des graphiques sont recalculés uniquement sur les valeurs conservées. Aucune catégorie Autres n’est ajoutée.</p><p><code>{CBStats id=15 field=Ville output=table sort=value dir=desc limit=10}</code><br><code>{CBStats idsum=15+16 field=Club output=bar sort=value dir=desc limit=15}</code></p>"
