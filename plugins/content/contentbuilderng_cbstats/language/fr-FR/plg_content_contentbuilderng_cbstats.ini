PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_SOURCE="Utilisez source=view ou source=manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_ID="Utilisez un identifiant de vue strictement positif, par exemple id=15."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_NUMERIC_SYNTAX="Écrivez les options numériques sans guillemets, par exemple id=15, idsum=15+16 ou limit=10."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_IDSUM="Utilisez deux à cinq identifiants de vues positifs et uniques, séparés par +, par exemple idsum=15+16."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_ID_CONFLICT="Utilisez soit id, soit idsum, jamais les deux."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_OUTPUT="Sorties autorisées : total, form_name, distinct, table, json, pie, bar, histogram, line, radar, sum, min, max et avg."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISTINCT_LABEL="Valeurs distinctes"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DISTINCT_TEXT="<p><code>output=distinct</code> compte les valeurs distinctes non vides de <code>field=</code> après l’application de tous les filtres CBStats habituels, des restrictions de vue/source et des droits.</p><p>Il accepte <code>filter[field]</code>, <code>filter[value]</code>, le raccourci <code>value=</code> sur le même champ, les jokers <code>*</code> et les alternatives <code>|</code>. Exemples : <code>{CBStats id=25 field=Departement output=distinct}</code> et <code>{CBStats id=25 field=Departement value=&quot;78|60&quot; output=distinct}</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_MANUAL_OUTPUT="Avec source=manual, utilisez total, table, pie, bar, histogram, line ou radar."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_IDSUM_OUTPUT="output=form_name ne peut pas être utilisé avec idsum."
