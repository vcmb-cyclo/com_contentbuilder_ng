PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_XML_DESCRIPTION="CBStats affiche des statistiques dynamiques provenant de vues ContentBuilder NG directement dans les articles Joomla, tout en conservant les droits d’accès et la configuration des vues. Exemple simple : {CBStats id=IdVue output=total}. Consultez la description ci-dessous pour découvrir toutes les options de syntaxe."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_CARD="Utilisez card=h1 à card=h6 ou card=v1 à card=v6."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_W="Utilisez w=33, w=66 ou w=100 sans guillemets."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_W_CARD="L’option w nécessite une option card valide."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_WIDTH_LABEL="Largeur des Cards"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_WIDTH_TEXT="<p>Dans <code>cb-cards</code>, <code>w=33</code> occupe une colonne, <code>w=66</code> deux colonnes et <code>w=100</code> toute la ligne. La valeur s’écrit sans guillemets et exige <code>card=</code>. Sans <code>w=</code>, V vaut 33 et H vaut 100. Sur petit écran, toutes les Cards occupent 100 %. Si une ligne n’a plus assez de place, la Card passe à la suivante.</p><p><code>w=</code> règle la Card ; <code>width=</code> règle le graphique à l’intérieur.</p><p><strong>Exemple :</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Groupe output=pie title=&quot;Groupes&quot; card=v1 w=33}<br>{CBStats id=15 field=Prenom output=bar title=&quot;Prénoms&quot; card=v2 w=66 width=100%}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_WIDTH="Utilisez un nombre éventuellement suivi de px ou %, par exemple width=350, width=350px ou width=80%."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_HEIGHT="Utilisez un nombre éventuellement suivi de px ou %, par exemple height=280, height=280px ou height=80%."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_LABEL="Card ContentBuilder NG commune facultative"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_CUSTOMIZE_LABEL="Personnaliser les Cards"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_GRID_LABEL="Juxtaposer les Cards V"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ARTICLE_EXAMPLE_LABEL="Exemple d’article complet sur deux lignes"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_ARTICLE_EXAMPLE_TEXT="<p>Placez jusqu’à six Cards V dans un seul conteneur <code>cb-cards</code>. Les trois premières forment la première ligne et les suivantes la deuxième. N’insérez aucun <code>&lt;br&gt;</code> et ne fermez pas le conteneur entre deux lignes. Une Card H seule peut être écrite directement après le conteneur.</p><p><strong>Exemple HTML Joomla, sans marqueurs Markdown ``` :</strong></p><p><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Groupe output=pie title=&quot;Groupes&quot; card=v1}<br>{CBStats id=15 field=Prenom output=bar title=&quot;Prénoms&quot; card=v2}<br>{CBStats id=15 field=Groupe output=table title=&quot;Détail&quot; card=v3}<br>{CBStats id=15 field=Ville output=pie title=&quot;Villes&quot; card=v4}<br>{CBStats id=15 field=Age output=histogram ranges=&quot;18-29;30-39;40-49;50+&quot; title=&quot;Âges&quot; card=v5}<br>{CBStats id=15 output=total title=&quot;Total&quot; card=v1}<br>&lt;/div&gt;<br>{CBList id=15 fields=&quot;Nom|Prenom|Email&quot; title=&quot;Derniers enregistrements&quot; sort=ID dir=desc limit=10 card=h1}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_GRID_TEXT="<p>Placez les trois balises dans un unique <code>&lt;div class=&quot;cb-cards&quot;&gt;</code>, sans <code>&lt;br&gt;</code> et sans fermer le conteneur entre deux balises. Sur PC, les V occupent trois colonnes ; sur petit écran, une seule. Une Card H occupe toute la ligne.</p><p><strong>Exemple :</strong><br><code>&lt;div class=&quot;cb-cards&quot;&gt;<br>{CBStats id=15 field=Groupe output=pie title=&quot;Groupes&quot; card=v1}<br>{CBStats id=15 field=Prenom output=bar title=&quot;Prénoms&quot; card=v2}<br>{CBStats id=15 field=Groupe output=table title=&quot;Détail&quot; card=v3}<br>&lt;/div&gt;</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_CUSTOMIZE_TEXT="<p><strong>Pour tout le site :</strong> ajoutez <code>.cb-card-h1 { --cb-card-accent: #005a9c; --cb-card-header-color: #fff; }</code> dans le fichier <code>user.css</code> du template Joomla. Remplacez <code>h1</code> par la variante H/V souhaitée.</p><p><strong>Pour un seul article :</strong> entourez les balises avec <code>&lt;div class=&quot;mes-cards&quot;&gt;…&lt;/div&gt;</code>, puis ajoutez <code>&lt;style&gt;.mes-cards .cb-card-h1 { --cb-card-accent: #005a9c; }&lt;/style&gt;</code> dans l’article si son éditeur et la politique du site autorisent les éléments style.</p><p>Personnalisations avancées : <code>--cb-card-header-bg</code>, <code>--cb-card-header-color</code>, <code>--cb-card-bg</code>, <code>--cb-card-color</code> et <code>--cb-card-border-color</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_CARD_TEXT="<p>Utilisez <code>card=h1</code> à <code>card=h6</code> ou <code>card=v1</code> à <code>card=v6</code>. Pour toutes les variantes, le titre reste horizontal et placé au-dessus du contenu. Le bandeau s’affiche uniquement avec un <code>title=</code> explicite et non vide.</p><p>Les titres des Cards utilisent <code>h4</code> par défaut. Ajoutez <code>|h1</code> à <code>|h6</code> après le titre pour sélectionner un niveau de titre, ou <code>|remX</code> / <code>|remX.X</code> pour définir une taille visuelle positive tout en conservant le niveau sémantique <code>h4</code>. Les espaces autour du dernier <code>|</code> sont facultatifs et la casse du suffixe est ignorée. Un suffixe non reconnu reste dans le titre complet, affiché avec le rendu <code>h4</code> par défaut.</p><p><code>{CBStats id=15 field=Groupe output=pie title=&quot;Répartition | h4&quot; card=h1}</code><br><code>{CBStats id=15 field=Groupe output=pie title=&quot;Répartition | rem1.25&quot; card=h1}</code></p><p>Surchargez les couleurs dans le fichier Joomla <code>user.css</code> avec les propriétés personnalisées <code>--cb-card-*</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DIMENSIONS_LABEL="Dimensions responsives des graphiques"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_DIMENSIONS_TEXT="<p><code>width=</code> règle la largeur du conteneur du graphique et <code>height=</code> sa hauteur. Les valeurs acceptées sont un entier positif, <code>px</code> ou <code>%</code>. Un nombre seul est converti en pixels : <code>width=350</code> équivaut à <code>width=350px</code>. Les expressions CSS, unités différentes et valeurs supérieures à 100 % ou 5 000px sont refusées.</p><p><strong>Sans option :</strong> Pie occupe 80 % du conteneur, reste centré et ne dépasse pas 350px. Bar, Histogram, Line et Radar occupent 100 % de la largeur disponible. Aucun graphique ne doit provoquer de défilement horizontal par défaut.</p><p><strong>Largeur explicite :</strong> <code>width=100%</code> permet à Pie d’utiliser toute la Card et supprime son maximum de 350px. <code>width=300</code> fixe 300px. Sur un petit conteneur, préférez un pourcentage pour conserver le responsive.</p><p><strong>Hauteur explicite :</strong> elle désactive la conservation automatique du ratio du graphique. <code>height=280</code> donne 280px. <code>height=80%</code> ne fonctionne utilement que si le parent possède déjà une hauteur CSS définie ; sinon utilisez des pixels.</p><p><strong>Exemples :</strong><br><code>{CBStats id=15 field=Groupe output=pie}</code><br><code>{CBStats id=15 field=Groupe output=pie width=100%}</code><br><code>{CBStats id=15 field=Groupe output=bar width=100% height=280}</code><br><code>{CBStats id=15 field=Groupe output=radar width=80% height=320px}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_LABEL="Masquer des éléments du résultat graphique"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_HIDE_TEXT="<p><code>hide=</code> accepte uniquement <code>total</code>, <code>values</code> et <code>graph</code>, combinés avec <code>|</code> dans n’importe quel ordre. <code>total</code> masque uniquement le Total affiché, <code>values</code> masque la liste textuelle des libellés et valeurs sous le graphique sans modifier le graphique lui-même, et <code>graph</code> masque le dessin en conservant cette liste textuelle légère. Sans <code>hide=</code>, tout est affiché. Masquer les trois éléments produit un message plutôt qu’un bloc vide. L’ancienne syntaxe <code>total=hide</code> est refusée ; utilisez <code>hide=&quot;total&quot;</code>.</p><p><code>hide=&quot;total|values&quot;</code> : graphique complet uniquement. <code>hide=&quot;graph|total&quot;</code> : liste textuelle uniquement. <code>hide=&quot;graph&quot;</code> : liste textuelle et Total. <code>hide=&quot;values&quot;</code> : graphique complet et Total. <code>hide=&quot;graph|values&quot;</code> : Total uniquement.</p><p><code>{CBStats id=15 field=GroupeVcmb output=bar hide=&quot;values&quot;}</code><br><code>{CBStats id=25 field=age output=histogram ranges=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;total|values&quot;}</code><br><code>{CBStats id=25 field=age output=radar ranges=&quot;18-29;30-39;40-49;50-59;60+&quot; hide=&quot;graph|total&quot;}</code></p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_TITLE="Version manuelle à conserver"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TITLE="Titre"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TITLES="Titres"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_VALUES="Valeurs"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SUMMARY_TOTAL="Total"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_SYNTAX_LABEL="Syntaxe manuelle CBStats"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPY="📋 Copier la syntaxe"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPIED="✓ Syntaxe copiée"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPORT_COPY_FAILED="Copie automatique impossible. Sélectionnez la syntaxe et utilisez Ctrl+C."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_LABEL="Export manuel"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_EXPORT_TEXT="<p>Seul <code>export=manual</code> affiche les résultats finaux et la syntaxe <code>source=manual</code> visible sous les outputs Pie, Bar et Table. Les libellés finaux après <code>titles=</code>, les ajouts et le tri sont directement intégrés dans <code>values=</code> ; <code>titles=</code> n’est pas recopié.</p><p><code>{CBStats id=25 field=Parcours output=pie title='👥 Total des inscrits' export=manual}</code></p><p>Le bouton centré <strong>Copier la syntaxe</strong> copie exactement la syntaxe affichée au-dessus. Avec une source déjà manuelle, la syntaxe finale normalisée est affichée une seule fois, sans imbrication.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_SOURCE="source doit valoir view ou manual."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_DEBUG_INVALID_MANUAL_OUTPUT="Le mode manuel accepte uniquement les outputs pie, bar, histogram, line, radar, table et total."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUES_REQUIRED="CBStats : aucune valeur manuelle valide n’a été fournie."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_MANUAL_VALUE_INVALID="CBStats : valeur manuelle invalide « %s »."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_MANUAL_LABEL="Mode manuel — figer des statistiques"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_HELP_MANUAL_TEXT="<p><code>source=manual</code> utilise exclusivement <code>values=</code>, sans vue, champ ni requête ContentBuilder. Il conserve les résultats même si une vue est réutilisée.</p><p><code>{CBStats source=manual output=pie values='100 km=45;150 km=47;200 km=38;200 km (Formule)=30' title='👥 Total des inscrits'}</code></p><p>Outputs&nbsp;: <code>pie</code>, <code>bar</code>, <code>table</code>, <code>total</code>. <code>add=</code>, <code>titles=</code>, <code>title=</code>, <code>sort=none|title|label|value</code> et <code>dir=asc|desc</code> restent disponibles. Les doublons sont additionnés. Dans un libellé, utilisez <code>\;</code>, <code>\=</code> et <code>\\</code>. N’ajoutez ni <code>id=</code> ni <code>field=</code>.</p>"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_VALUE="Valeur"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TOTAL="Total"
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_TOTAL_SEPARATOR=" :"
