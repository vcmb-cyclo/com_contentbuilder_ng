PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_FILTER="Indiquez ensemble filter[field] et filter[value], ou utilisez value= comme raccourci sur le même champ."
PLG_CONTENT_CONTENTBUILDERNG_CBSTATS_EXPECTED_SORT="Utilisez sort=none, sort=title ou sort=value."
